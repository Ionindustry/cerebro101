# Niveles de autonomía (sección «Flujos, gobernanza y aprobaciones» del documento).
niveles:
  libre:
    descripcion: "Analizar, resumir, clasificar y redactar borradores internos"
    aprobadores: []
  # FIRMA ÚNICA: todo lo que requiere aprobación lo firma Dirección, una sola persona, sin importar el departamento. (Antes «doble» pedía además
  # al responsable del departamento y a una segunda persona.) El motor sigue admitiendo varios firmantes por si se quiere volver a exigirlos:
  # basta con poner [responsable_departamento, direccion] en el nivel que corresponda.
  simple:
    descripcion: "Enviar a clientes, publicar, responder reseñas, contactar terceros"
    aprobadores: [direccion]
    voz_permitida: true
  doble:
    descripcion: "Pagos, facturas, contratos, precios, ofertas, firma y presentación de licitaciones (firma de Dirección, en el panel o por voz)"
    aprobadores: [direccion]
    voz_permitida: true         # por decisión de Dirección, también lo delicado puede firmarse por voz

# Acciones que ningún agente puede ejecutar nunca, sea cual sea su ficha.
prohibidas:
  - borrar_datos
  - cambiar_permisos
  - firmar_en_nombre_de_la_empresa
  - validar_documento_erp      # los documentos del ERP los valida siempre una persona

# QUÉ NECESITA FIRMA. Se decide por la operación, no por el agente:
#   estándar    → no pide firma: lecturas, borradores, propuestas, resúmenes… (todo lo que no está en las dos listas de abajo ni sale de la empresa)
#   supervisada → pide tu firma: todo lo que sale de la empresa (operaciones marcadas como externas en su herramienta + `impacto_externo`) y lo que añadas en `supervisadas`
#   reservada   → compromisos económicos o legales: firma individual (también por voz) y NO se puede cubrir con una autorización por objetivo
# Se escribe como «herramienta.operacion» (p. ej. correo.enviar) o como nombre de acción (p. ej. publicar).
supervision:
  supervisadas: []
  reservadas:
    - presentar_licitacion
    - pedido_proveedor
    - alta_mayorista
    - mayorista.alta

# Acciones con impacto externo: obligan a pasar por la bandeja aunque la ficha diga «libre».
impacto_externo:
  - enviar_correo
  - responder_correo
  - publicar
  - enviar_whatsapp
  - presentar_licitacion       # la hace una persona; el agente solo prepara el paquete
  - pedido_proveedor
  - alta_mayorista
