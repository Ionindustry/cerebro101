# Herramientas disponibles y sensibilidad máxima de datos que pueden recibir.
# Un agente solo usa una herramienta si está en su ficha Y su sensibilidad lo permite.
herramientas:
  conocimiento:              {local: true,  sensibilidad_max: alta}
  cuaderno:                  {local: true,  sensibilidad_max: alta,  nota: "cuadernos de investigación en la base de datos propia; traer páginas web solo con sensibilidad baja"}
  erpnext:                   {local: true,  sensibilidad_max: alta}
  ficheros:                  {local: true,  sensibilidad_max: alta}
  cotizador:                 {local: true,  sensibilidad_max: alta}
  comparador_instaladores:   {local: true,  sensibilidad_max: alta}
  correo:                    {local: false, sensibilidad_max: alta,  nota: "servidor de correo propio"}
  calendario:                {local: false, sensibilidad_max: media}
  scrapegraph:               {local: true,  sensibilidad_max: baja,  nota: "modelo local; solo salen visitas a webs públicas"}
  agent_reach:               {local: false, sensibilidad_max: baja,  nota: "contenedor aislado, solo lectura de contenido público"}
  grok:                      {local: false, sensibilidad_max: baja,  nota: "API de xAI; solo consultas sobre temas públicos"}
  web:                       {local: false, sensibilidad_max: baja,  nota: "búsqueda en internet (SearXNG propio) y lectura de páginas públicas; las consultas no pueden llevar datos de clientes ni de personas"}
  jev:                       {local: false, sensibilidad_max: media, nota: "nube de TypeSafe; media solo con retención cero y datos anonimizados"}
  jeff:                      {local: true,  sensibilidad_max: alta,  nota: "sustituto local de Jev"}
  plataformas_contratacion:  {local: false, sensibilidad_max: baja}
  pliegos:                   {local: true,  sensibilidad_max: alta,  nota: "baja documentos públicos de licitaciones por id (lista de plataformas, anti-SSRF) a cuarentena y antivirus; nunca devuelve el fichero"}
  licitaciones:              {local: true,  sensibilidad_max: alta,  nota: "motor de licitaciones propio (red interna), solo lectura de datos públicos; no sale ningún dato"}
  ofertas:                   {local: true,  sensibilidad_max: alta,  nota: "borrador de la oferta de una licitación en la base del Cerebro; los agentes solo escriben borradores, una persona los revisa, fija el precio y presenta; no sale ningún dato"}
  plantillas:                {local: true,  sensibilidad_max: alta,  nota: "rellena las plantillas administrativas del concurso con los datos de la sociedad del ERP y de la ficha; el agente solo elige qué dato va en cada hueco, nunca el valor; no sale ningún dato y nada se firma"}
  documentos_subidos:        {local: true,  sensibilidad_max: alta,  nota: "lee el TEXTO de los documentos que una persona sube al chat (tras cuarentena y antivirus); nunca devuelve el fichero"}
  listas_precios:            {local: true,  sensibilidad_max: alta,  nota: "importa listas de precios de proveedores desde un documento subido: propone, y solo escribe en el ERP (proveedor, artículos, precios) tras la aprobación de una persona"}
  mayorista:                 {local: false, sensibilidad_max: alta,  nota: "portal o API del mayorista de telecom"}

# Si una herramienta externa no admite la sensibilidad del agente, se usa esta alternativa local.
alternativas_locales:
  jev: jeff
