# Perfil de 101.cat para el resumen diario de licitaciones (y la puntuación de encaje). Decisiones de Dirección del 26/10/2026
# (docs/PROYECTO_LICITACIONES.md §12); los PESOS son una propuesta POR VALIDAR con Dirección: se cambian aquí, sin tocar código.
resumen:
  hora: "16:00"               # hora local (TZ) a la que se genera y se entrega en el panel (ver tareas/celery_app.py)
  oportunidades_max: 20       # cuántas oportunidades se detallan (las demás se cuentan)
  otras_max: 10               # adjudicaciones y anulaciones que se detallan
  paginas_max: 5              # páginas de 100 que se leen del motor como máximo (si hay más, el resumen lo dice)
  avisos_por_alerta: 5        # cuántos avisos de cada alerta de departamento (canal resumen_diario) se detallan en el resumen; los demás se cuentan

# CPV de interés (§12.1). Cada código cubre también sus descendientes («jerarquía», propuesta por validar): 72000000 cubre toda la división 72.
cpv:
  - {codigo: "72000000", area: "Servicios TI"}
  - {codigo: "72200000", area: "Servicios TI"}
  - {codigo: "72230000", area: "Servicios TI"}
  - {codigo: "72262000", area: "Servicios TI"}
  - {codigo: "72267000", area: "Servicios TI"}
  - {codigo: "32323500", area: "Videovigilancia"}
  - {codigo: "32235000", area: "Videovigilancia"}
  - {codigo: "32234000", area: "Videovigilancia"}
  - {codigo: "35125300", area: "Videovigilancia"}
  - {codigo: "35120000", area: "Videovigilancia"}
  - {codigo: "34970000", area: "Control de tráfico"}
  - {codigo: "34923000", area: "Control de tráfico"}
  - {codigo: "34971000", area: "Control de tráfico"}
  - {codigo: "34972000", area: "Control de tráfico"}
  - {codigo: "63712710", area: "Control de tráfico"}
  - {codigo: "45316210", area: "Control de tráfico"}
  - {codigo: "42961000", area: "Mando y control"}
  - {codigo: "42961100", area: "Mando y control"}
  - {codigo: "32420000", area: "Redes"}
  - {codigo: "32441100", area: "Vigilancia telemétrica"}

zona:
  prioritaria: "ES51"         # Cataluña primero (NUTS)
  pais: "ES"                  # toda España puntúa algo (§12.2: ingesta todo y se puntúa por zona)

importe_max: 1000000          # euros, sin IVA (§12.4); por encima no se detalla en el resumen (se cuenta)

# Puntos máximos de cada criterio (suman 100). El encaje es la suma de lo obtenido sobre lo aplicable, en tanto por ciento.
pesos:
  cpv: 40
  zona: 20
  importe: 15
  plazo: 15
  procedimiento: 10

# Embudo propio: el consumidor de eventos mete en el embudo (estado «detectada») las licitaciones NUEVAS, abiertas y con un encaje igual o superior
# a este umbral (0–100). Propuesta POR VALIDAR con Dirección: se vigila cuántas entran al día (si son más de 50, subirlo antes de que Viabilidad se
# sature, ADR 0007). Se puede cambiar sin tocar código, o con la variable LICITACIONES_ENCAJE_MIN.
embudo:
  encaje_min: 60

# Plazos en el calendario: el botón «Añadir el plazo al calendario» del embudo crea (o actualiza) un evento corto que TERMINA a la hora del plazo, con recordatorios
# unos días antes, en el calendario de la empresa (CalDAV, cuenta CALENDARIO_LICITACIONES_* o, si no, CALENDARIO_*). Lo hace una persona al pulsar: sin invitados.
calendario_plazos:
  duracion_min: 30              # el evento ocupa los últimos 30 minutos antes del plazo
  recordatorios_dias: [3, 1]    # avisos del calendario antes del plazo
  calendario: ""                # nombre del calendario donde se crea; vacío = el primero de la cuenta

# Seguimiento en el CRM (Frappe CRM, cerebro/licitaciones/crm.py): cada licitación que se estudia es un trato del organismo comprador y cada hito (estudiar, preparar la oferta, fijar el precio,
# presentar, ganar, perder) queda como nota del trato. Los agentes de Licitaciones leen el trato y pueden añadir notas y tareas. Si el CRM no responde, no se pierde nada: se anota en el registro.
crm:
  activo: true
  crear_detectadas: false       # false: el trato nace cuando se decide estudiarla; true: también las que detecta el sistema (más ruido en el CRM)
  url_publica: http://localhost:8081/crm       # dirección del CRM para los enlaces del panel
  etapas:                       # etapa del trato según el estado del embudo (los nombres de las etapas de tu CRM)
    detectada: Qualification
    en_estudio: Proposal/Quotation
    presentada: Negotiation
    ganada: Won
    perdida: Lost
    descartada: Lost

# Alertas guardadas: un evento (nueva, adjudicada…) solo genera aviso si el expediente se ha actualizado en los últimos días. Así la carga del histórico y la
# primera lectura del flujo no inundan a nadie de avisos de licitaciones de hace meses.
alertas:
  max_antiguedad_dias: 7

# Rastreo diario del embudo: cada día a esta hora el Rastreador pide a Viabilidad el informe ir/no ir de las licitaciones «detectada» (cerebro/licitaciones/rastreo.py).
# El informe es consultivo: no cambia el estado ni decide por la gente. El trabajo con modelos queda acotado por max_por_dia (si hay más, siguen al día siguiente, de más a
# menos encaje); propuesta POR VALIDAR: si Viabilidad se satura, bajar este número o subir embudo.encaje_min.
rastreo:
  hora: "06:30"                 # hora local
  max_por_dia: 10
  dias_minimos_hasta_plazo: 3   # con menos días de plazo no se pide informe (no da tiempo a preparar una oferta)

# «Nuevo competidor» (alertas de competencia con «solo empresas nuevas»): solo se avisa si el motor tiene adjudicaciones de hace al menos estos meses; con menos historia
# casi cualquier adjudicatario parecería nuevo. Docs: docs/PROYECTO_LICITACIONES.md.
nuevo_competidor:
  cobertura_meses: 12

# Simulador de ofertas (docs/PROYECTO_LICITACIONES.md §6): umbrales para decir si el resultado es apto para decidir. Los fija Dirección; el simulador no se usa para decidir
# mientras no los cumpla (muestra mínima de concursos parecidos y error máximo de calibración con el pasado).
simulador:
  muestra_min: 30             # concursos parecidos como mínimo
  error_max: 0.10             # error medio de calibración (backtesting) como máximo
  riesgo_anormal_max: 0.20    # riesgo de baja anormal que se acepta al recomendar un precio
  paso_baja_pct: 1            # de cuánto en cuánto se recorre la baja (puntos porcentuales)
  baja_max_pct: 40            # baja máxima que se explora
  paginas_max: 5              # páginas de 100 adjudicaciones que se leen del motor por búsqueda
  anios: 5                    # antigüedad máxima de los concursos parecidos

# Vigilante del motor (cerebro/licitaciones/vigilante.py): cada 15 minutos mira el estado del motor y, si una fuente lleva demasiado sin ingesta correcta (o el motor no responde),
# avisa por correo interno UNA vez al empezar el problema, lo recuerda cada `repetir_cada_horas` mientras siga y avisa cuando se arregla. Sin destinatarios, solo queda en el registro.
vigilante:
  horas_sin_ingesta: 3        # una fuente sin ingesta correcta durante más de estas horas se da por atascada (la ingesta corre cada hora)
  hora_control_hoy: 22        # en día laborable, pasada esta hora (local), si no ha entrado NINGUNA licitación nueva ni actualizada hoy, se avisa. La plataforma de contratación publica UNA tanda
                              # al día, hacia las 20:15: lo de hoy no existe antes; con 22 hay margen para que la ingesta (cada 15 min) lo recoja
  repetir_cada_horas: 24      # mientras siga atascado, recordarlo cada tanto
  destinatarios: [soporte@101.cat]   # direcciones de la empresa (dominios de config/buzones.yaml → avisos); vacío = sin correo

# Datos de la empresa para rellenar la documentación administrativa de una oferta (cerebro/licitaciones/empresa.py). SALEN DEL ERP (Company, Address y Contact): así toda la información está
# en el mismo sitio y no hay otro fichero que mantener. Aquí solo se dice DÓNDE está cada cosa. Si falta un dato, la plantilla queda con ese hueco y el panel dice qué hay que completar en el ERP.
# Si hay varias empresas en el ERP, se elige con cuál se presenta cada oferta. El representante es el contacto de la empresa (Contact enlazado a la Company) cuyo cargo (designation) es uno de estos.
empresa:
  departamento_erp: licitaciones        # el usuario técnico del ERP con el que se leen (necesita «sistema» en config/erp_acceso.yaml)
  designaciones: [administrador, apoderado, representante legal, gerente, director general, consejero delegado]
  campos:                               # nombre del campo en ERPNext; los personalizados se cambian aquí (si el campo no existe en tu ERP, el dato se da por no informado)
    empresa_registro: registration_details       # Company: datos de inscripción en el Registro Mercantil
    representante_dni: dni                       # Contact: campo personalizado con el DNI/NIE del representante
    representante_poder: poder                   # Contact: campo personalizado con los datos del poder (escritura, notario, fecha)
  # DEUC: cada sociedad tiene su DEUC base (un Word con los datos de la empresa ya rellenados) ADJUNTO a su ficha de empresa (Company) en el ERP, con «DEUC» en el nombre del fichero.
  # En cada concurso se copia y solo se rellenan los campos propios del concurso (título, expediente, órgano de contratación…); lo demás no se toca.
  deuc_patron: "deuc|espd"
