# Buzones de correo de la empresa que pueden usar los agentes (herramienta «correo»).
#
# Cada buzón dice qué DEPARTAMENTOS pueden usarlo: el departamento de un agente lo fija el sistema, no el modelo, así que un agente de
# Personas nunca puede abrir administracion@ ni uno de Finanzas rrhh@. Las contraseñas NO van aquí: están en `.env.buzones`
# (variables CORREO_<BUZON>_CLAVE, y CORREO_<BUZON>_USUARIO si el usuario de acceso no es la propia dirección).
#
# Dar de alta un buzón:   python3 scripts/buzon_alta.py --id rrhh --direccion rrhh@101.cat --departamentos personas
# Probar los buzones:     python3 scripts/probar_buzones.py
#
# Lo que los agentes pueden hacer: leer, redactar borradores (aparecen en la carpeta Borradores del buzón) y marcar como gestionado.
# CONTESTAR o ENVIAR sale de la empresa: pasa SIEMPRE por la bandeja de aprobaciones y una persona ve el texto completo antes de aprobar.
#
# Comercial usa de momento la cuenta albert@101.cat; cuando exista comercial@ se cambia aquí.

servidor:                       # valores por defecto de todos los buzones; cada buzón puede sustituirlos con sus propios «imap» y «smtp»
  imap: {host: "imap.101.cat", puerto: 143, seguridad: ninguna}          # seguridad: ssl | starttls | ninguna (esta última solo para pruebas)
  smtp: {host: "smtp.101.cat", puerto: 587, seguridad: starttls,     # seguridad: ssl | starttls | ninguna
         tls_nombre: "smtp.servidor-correo.net"}                      # el certificado del proveedor (Acens) vale para *.servidor-correo.net, no para smtp.101.cat; se verifica contra este nombre
carpetas: {entrada: "INBOX", borradores: "Drafts", enviados: "Sent"}  # los nombres cambian según el proveedor (p. ej. «Borradores», «Elementos enviados»)

limites:
  destinatarios_max: 5          # destinatarios de un mismo mensaje
  texto_max: 6000               # caracteres del cuerpo que escribe un agente
  mensajes_max: 20              # mensajes que devuelve una lectura de bandeja
  adjunto_max_mb: 10            # tamaño máximo de un adjunto que se abre o se guarda en el ERP
  adjunto_texto_chars: 6000     # caracteres que devuelve cada lectura de un adjunto (cabe en el contexto del modelo); si hay más, se sigue por trozos

# Pie obligatorio en comunicaciones comerciales (LSSI): forma sencilla y gratuita de darse de baja
pie_comercial: >-
  Has recibido este mensaje porque nos diste tu consentimiento o eres cliente de 101.cat.
  Si no quieres recibir más comunicaciones, responde con la palabra BAJA.

# Avisos automáticos del propio sistema (alertas de licitaciones con canal «correo»). Salen del buzón `buzon` y SOLO a direcciones de los `dominios`:
# es correo interno entre la gente de la empresa, así que no pasa por aprobación; cualquier otra dirección se rechaza al crear la alerta y otra vez al enviar.
avisos:
  buzon: notificaciones
  dominios: [101.cat]
  max_por_correo: 20            # avisos que caben en un correo (si hay más, salen en el siguiente)
  max_intentos: 5               # envíos fallidos antes de darlo por perdido
  max_antiguedad_horas: 48      # un aviso que no se ha podido enviar en este tiempo ya no se envía

buzones:
  administracion:
    direccion: administracion@101.cat
    departamentos: [direccion, operaciones, telecom]
    descripcion: "Gestión administrativa general, proveedores y operadores"
    firma: "Departamento de Administración · 101.cat"
  facturacion:
    direccion: facturacion@101.cat
    departamentos: [finanzas]
    descripcion: "Facturas, cobros y reclamaciones de pago"
    firma: "Facturación · 101.cat"
  rrhh:
    direccion: rrhh@101.cat
    departamentos: [personas]
    descripcion: "Candidaturas, vacaciones, bajas y gestiones de personal"
    firma: "Recursos Humanos · 101.cat"
  soporte:
    direccion: soporte@101.cat
    departamentos: [atencion]
    descripcion: "Incidencias y atención al cliente"
    firma: "Atención al cliente · 101.cat"
  albert:
    direccion: albert@101.cat
    departamentos: [comercial]
    descripcion: "Cuenta personal de Albert, usada por Comercial (todo envío lo aprueba una persona)"
    firma: "Albert · 101.cat"
  concursos:
    direccion: concursos@101.cat
    departamentos: [licitaciones]
    descripcion: "Concursos y licitaciones públicas"
    firma: "Licitaciones · 101.cat"
  notificaciones:
    direccion: notificaciones@101.cat
    departamentos: []           # ningún agente lo usa: solo lo usa el sistema para los avisos de arriba
    descripcion: "Avisos automáticos del sistema (alertas de licitaciones)"
    firma: "Cerebro · 101.cat"
