# Dashboard de cada DEPARTAMENTO (Agentes → elegir departamento → «Dashboard del departamento»): los KPI más específicos del área, agrupados.
# Mismo formato que arriba, con `grupo` para agruparlos en pantalla. Se suman al resumen de actividad de todos sus agentes.
paneles_departamento:
  finanzas:
    - {grupo: "Cartera de clientes", nombre: "Pendiente de cobro", tipo: erp, doctype: "Sales Invoice", agregado: sumar, campo: outstanding_amount, filtros: [["docstatus", "=", 1]], unidad: "€"}
    - {grupo: "Cartera de clientes", nombre: "Facturas vencidas sin cobrar", tipo: erp, doctype: "Sales Invoice", agregado: contar, filtros: [["docstatus", "=", 1], ["outstanding_amount", ">", 0], ["due_date", "<", "{hoy}"]], unidad: "facturas"}
    - {grupo: "Cartera de clientes", nombre: "Importe vencido", tipo: erp, doctype: "Sales Invoice", agregado: sumar, campo: outstanding_amount, filtros: [["docstatus", "=", 1], ["due_date", "<", "{hoy}"]], unidad: "€"}
    - {grupo: "Cartera de clientes", nombre: "Media de retraso en facturas vencidas", tipo: erp, doctype: "Sales Invoice", agregado: retraso_medio, campo: due_date, filtros: [["docstatus", "=", 1], ["outstanding_amount", ">", 0], ["due_date", "<", "{hoy}"]], unidad: "días"}
    - {grupo: "Cartera de clientes", nombre: "Cobros recuperados", tipo: erp, doctype: "Payment Entry", agregado: sumar, campo: paid_amount, filtros: [["docstatus", "=", 1], ["payment_type", "=", "Receive"], ["party_type", "=", "Customer"]], periodo: posting_date, unidad: "€"}
    - {grupo: "Proveedores y pagos", nombre: "Pendiente de pago a proveedores", tipo: erp, doctype: "Purchase Invoice", agregado: sumar, campo: outstanding_amount, filtros: [["docstatus", "=", 1]], unidad: "€"}
    - {grupo: "Proveedores y pagos", nombre: "Pagos realizados", tipo: erp, doctype: "Payment Entry", agregado: sumar, campo: paid_amount, filtros: [["docstatus", "=", 1], ["payment_type", "=", "Pay"]], periodo: posting_date, unidad: "€"}
    - {grupo: "Proveedores y pagos", nombre: "Facturas de proveedor en borrador", tipo: erp, doctype: "Purchase Invoice", agregado: contar, filtros: [["docstatus", "=", 0]], unidad: "facturas", ayuda: "esperan revisión humana"}
    - {grupo: "Actividad del periodo", nombre: "Facturado", tipo: erp, doctype: "Sales Invoice", agregado: sumar, campo: grand_total, filtros: [["docstatus", "=", 1]], periodo: posting_date, unidad: "€"}
    - {grupo: "Actividad del periodo", nombre: "Compras facturadas", tipo: erp, doctype: "Purchase Invoice", agregado: sumar, campo: grand_total, filtros: [["docstatus", "=", 1]], periodo: posting_date, unidad: "€"}
    - {grupo: "Actividad del periodo", nombre: "Asientos en borrador", tipo: erp, doctype: "Journal Entry", agregado: contar, filtros: [["docstatus", "=", 0]], unidad: "asientos"}
  comercial:
    - {grupo: "Captación", nombre: "Leads nuevos", tipo: erp, doctype: "CRM Lead", agregado: contar, periodo: creation, unidad: "leads"}
    - {grupo: "Captación", nombre: "Leads sin contactar", tipo: erp, doctype: "CRM Lead", agregado: contar, filtros: [["status", "=", "New"]], unidad: "leads"}
    - {grupo: "Captación", nombre: "Organizaciones nuevas", tipo: erp, doctype: "CRM Organization", agregado: contar, periodo: creation, unidad: "organizaciones"}
    - {grupo: "Oportunidades", nombre: "Oportunidades abiertas", tipo: erp, doctype: "CRM Deal", agregado: contar, filtros: [["status", "not in", ["Won", "Lost"]]], unidad: "oportunidades"}
    - {grupo: "Oportunidades", nombre: "Oportunidades ganadas", tipo: erp, doctype: "CRM Deal", agregado: contar, filtros: [["status", "=", "Won"]], periodo: modified, unidad: "oportunidades"}
    - {grupo: "Oportunidades", nombre: "Oportunidades perdidas", tipo: erp, doctype: "CRM Deal", agregado: contar, filtros: [["status", "=", "Lost"]], periodo: modified, unidad: "oportunidades"}
    - {grupo: "Presupuestos y ventas", nombre: "Presupuestos emitidos", tipo: erp, doctype: Quotation, agregado: contar, periodo: transaction_date, unidad: "presupuestos"}
    - {grupo: "Presupuestos y ventas", nombre: "Importe presupuestado", tipo: erp, doctype: Quotation, agregado: sumar, campo: grand_total, periodo: transaction_date, unidad: "€"}
    - {grupo: "Presupuestos y ventas", nombre: "Pedidos de venta", tipo: erp, doctype: "Sales Order", agregado: contar, periodo: transaction_date, unidad: "pedidos"}
    - {grupo: "Presupuestos y ventas", nombre: "Importe de pedidos", tipo: erp, doctype: "Sales Order", agregado: sumar, campo: grand_total, periodo: transaction_date, unidad: "€"}
    - {grupo: "Clientes", nombre: "Clientes", tipo: erp, doctype: Customer, agregado: contar, unidad: "clientes"}
    - {grupo: "Clientes", nombre: "Clientes nuevos", tipo: erp, doctype: Customer, agregado: contar, periodo: creation, unidad: "clientes"}
  operaciones:
    - {grupo: "Proyectos", nombre: "Proyectos abiertos", tipo: erp, doctype: Project, agregado: contar, filtros: [["status", "=", "Open"]], unidad: "proyectos"}
    - {grupo: "Proyectos", nombre: "Proyectos completados", tipo: erp, doctype: Project, agregado: contar, filtros: [["status", "=", "Completed"]], periodo: modified, unidad: "proyectos"}
    - {grupo: "Proyectos", nombre: "Tareas pendientes", tipo: erp, doctype: Task, agregado: contar, filtros: [["status", "in", ["Open", "Working", "Pending Review"]]], unidad: "tareas"}
    - {grupo: "Proyectos", nombre: "Tareas vencidas", tipo: erp, doctype: Task, agregado: contar, filtros: [["status", "in", ["Open", "Working"]], ["exp_end_date", "<", "{hoy}"]], unidad: "tareas"}
    - {grupo: "Compras", nombre: "Pedidos de compra", tipo: erp, doctype: "Purchase Order", agregado: contar, periodo: transaction_date, unidad: "pedidos"}
    - {grupo: "Compras", nombre: "Importe comprado", tipo: erp, doctype: "Purchase Order", agregado: sumar, campo: grand_total, periodo: transaction_date, unidad: "€"}
    - {grupo: "Compras", nombre: "Pedidos en borrador", tipo: erp, doctype: "Purchase Order", agregado: contar, filtros: [["docstatus", "=", 0]], unidad: "pedidos"}
    - {grupo: "Compras", nombre: "Solicitudes de material abiertas", tipo: erp, doctype: "Material Request", agregado: contar, filtros: [["docstatus", "=", 1], ["status", "=", "Pending"]], unidad: "solicitudes"}
    - {grupo: "Entregas e inventario", nombre: "Albaranes de entrega", tipo: erp, doctype: "Delivery Note", agregado: contar, periodo: posting_date, unidad: "albaranes"}
    - {grupo: "Entregas e inventario", nombre: "Órdenes de trabajo en curso", tipo: erp, doctype: "Work Order", agregado: contar, filtros: [["status", "=", "In Process"]], unidad: "órdenes"}
    - {grupo: "Entregas e inventario", nombre: "Artículos activos", tipo: erp, doctype: Item, agregado: contar, filtros: [["disabled", "=", 0]], unidad: "artículos"}
    - {grupo: "Entregas e inventario", nombre: "Artículos sin existencias", tipo: erp, doctype: Bin, agregado: contar, filtros: [["actual_qty", "<=", 0]], unidad: "artículos"}
  atencion:
    - {grupo: "Incidencias", nombre: "Incidencias abiertas", tipo: erp, doctype: Issue, agregado: contar, filtros: [["status", "=", "Open"]], unidad: "incidencias"}
    - {grupo: "Incidencias", nombre: "Incidencias de prioridad alta abiertas", tipo: erp, doctype: Issue, agregado: contar, filtros: [["status", "=", "Open"], ["priority", "=", "High"]], unidad: "incidencias"}
    - {grupo: "Incidencias", nombre: "Incidencias nuevas", tipo: erp, doctype: Issue, agregado: contar, periodo: creation, unidad: "incidencias"}
    - {grupo: "Incidencias", nombre: "Incidencias cerradas", tipo: erp, doctype: Issue, agregado: contar, filtros: [["status", "=", "Closed"]], periodo: modified, unidad: "incidencias"}
    - {grupo: "Garantías y mantenimiento", nombre: "Garantías abiertas", tipo: erp, doctype: "Warranty Claim", agregado: contar, filtros: [["status", "=", "Open"]], unidad: "reclamaciones"}
    - {grupo: "Garantías y mantenimiento", nombre: "Visitas de mantenimiento", tipo: erp, doctype: "Maintenance Visit", agregado: contar, periodo: mntc_date, unidad: "visitas"}
    - {grupo: "Garantías y mantenimiento", nombre: "Planes de mantenimiento", tipo: erp, doctype: "Maintenance Schedule", agregado: contar, unidad: "planes"}
    - {grupo: "Clientes", nombre: "Clientes", tipo: erp, doctype: Customer, agregado: contar, unidad: "clientes"}
  direccion:
    - {grupo: "Ventas", nombre: "Pedidos de venta (importe)", tipo: erp, doctype: "Sales Order", agregado: sumar, campo: grand_total, periodo: transaction_date, unidad: "€"}
