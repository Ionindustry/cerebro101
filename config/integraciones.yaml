# Integraciones directas (sin n8n). Las credenciales van en .env, nunca aquí.

# El correo (varios buzones) se configura en config/buzones.yaml; sus contraseñas, en secretos/buzones.env.

calendario:                   # servidor CalDAV propio (el del servidor de correo o uno aparte)
  url: "https://mail.101.cat/dav/"
  jornada: {inicio: "08:00", fin: "18:00", dias: [0, 1, 2, 3, 4]}   # lunes a viernes

contratacion:
  # Fuentes de sindicación (ATOM) de las plataformas de contratación pública.
  # Rellenar con las URL vigentes de la Plataforma de Contratación del Sector Público
  # y de la plataforma de contratación de Cataluña.
  feeds: []
  # Prefijos CPV que interesan a las 10 áreas de servicio; los define Licitaciones.
  cpv_interes: []
  carpeta_paquetes: "licitaciones"     # dentro de /datos
  # Pliegos (herramienta «pliegos», docs/SEGURIDAD.md §3.10): se bajan por id, a cuarentena, y solo se ofrecen si el antivirus (ClamAV) los da por limpios.
  pliegos:
    hosts: [contrataciondelestado.es, contrataciondelsectorpublico.gob.es, contractaciopublica.cat]   # únicas plataformas de las que se baja (y sus subdominios)
    max_mb: 100                      # tamaño máximo de un documento
    max_diarios: 40                  # descargas de documentos al día (en total)
    timeout_s: 120                   # plazo de una descarga y de un análisis
    firmas_max_horas: 48             # si las firmas del antivirus son más viejas, no se fía del análisis

# Documentos que una persona sube al chat de Jarvis (cerebro/subidas.py): cuarentena, antivirus (ClamAV) y solo su texto llega a los agentes.
subidas:
  max_mb: 25                         # tamaño máximo de un documento
  max_diarios: 40                    # subidas por persona y día
  retencion_dias: 30                 # pasado este tiempo se borran el fichero y su texto
  timeout_s: 130                     # plazo de la lectura del documento
