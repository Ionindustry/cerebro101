# Fichas técnicas de producto (api/cerebro/licitaciones/fichas.py).
# Solo se descargan fichas de los dominios de esta lista (https; también sus subdominios). Está VACÍA a propósito: añade aquí los dominios OFICIALES de cada fabricante
