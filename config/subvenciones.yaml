# Catálogo de fuentes del radar de subvenciones (ARES Funding Intelligence, api/cerebro/subvenciones/).
# REGLA: nada se da por conectado sin comprobarlo. Una fuente nace en PENDING_VERIFICATION (o PENDING_ACCESS si se sabe que no hay acceso automatizado permitido)
# y solo pasa a ACTIVE cuando una persona de Dirección la habilita en el panel tras comprobar con datos reales que el conector funciona.
# No se inventan direcciones de API: si no hay un servicio oficial confirmado, api_base_url queda vacío. No se extrae contenido de páginas web contra sus condiciones de uso.
# Los parámetros del conector (settings) se ajustan aquí o en el panel sin tocar el código. Este fichero solo ALTA fuentes nuevas y actualiza sus datos descriptivos; el
# estado, si está habilitada y la marca de sincronización los lleva la base de datos (no se pisan al reiniciar).

sincronizacion:
  paginas_maximas_por_ejecucion: 40        # tope de páginas por ejecución (cuota); el resto se trae en la siguiente, desde la marca guardada
  tamano_pagina: 50
  pausa_entre_peticiones_s: 0.5            # cortesía hacia el servicio oficial
  timeout_s: 30
  reintentos: 3
  dias_proximo_cierre: 15                  # CLOSING_SOON: faltan estos días o menos para el plazo
  dias_novedad: 7                          # una oportunidad detectada hace menos de estos días se marca como nueva

fuentes:
