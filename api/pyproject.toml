[project]
name = "cerebro-101"
version = "0.1.0"
description = "Cerebro 101.cat: sistema multiagente local para la gestión de la empresa"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
  "celery[redis]>=5.6",
  "redis>=6.4,<7",             # el transporte Redis de kombu 5.6+ exige redis-py 6.x: sin fijarlo, una capa de caché de la imagen dejaba redis 5.3 y el worker no arrancaba
  "pyjwt[crypto]>=2.8",
  "caldav>=1.3",
  "pypdf>=5.0",
  "openpyxl>=3.1",
  "defusedxml>=0.7",          # openpyxl lo usa solo si está: protege la lectura de Excel de terceros (entidades XML malintencionadas)
  "pillow>=10.1",
  "nats-py>=2.9",
]

[project.optional-dependencies]
investigacion = ["scrapegraphai>=1.30"]
observabilidad = ["langfuse>=3,<4", "langchain>=1,<2"]
desarrollo = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
