name: Imágenes

# Construye en GitHub (no en tu PC) las imágenes que se despliegan y las publica en ghcr.io, para poder actualizar descargándolas ya hechas:
# `./scripts/actualizar.sh` (ver docs/INSTALAR_LOCAL_WINDOWS.md). Solo corre sobre `main`, es decir, después de que el PR haya pasado los cuatro
# checks y se haya fusionado; nunca desde un PR ni desde un fork.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagenes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    name: ${{ matrix.nombre }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write          # solo este trabajo puede escribir en el registro de GitHub
    strategy:
      fail-fast: false
      matrix:
        include:
          - {nombre: api, contexto: ., dockerfile: api/Dockerfile}
          - {nombre: panel, contexto: panel, dockerfile: panel/Dockerfile}
          - {nombre: licitaciones, contexto: licitaciones, dockerfile: licitaciones/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - name: Nombre del propietario en minúsculas (el registro no admite mayúsculas)
        run: echo "PROPIETARIO=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.PROPIETARIO }}/cerebro101-${{ matrix.nombre }}:main
            ghcr.io/${{ env.PROPIETARIO }}/cerebro101-${{ matrix.nombre }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}
