name: CI

# Se ejecuta en cada PR y en cada cambio de main. Si algo falla, no se debe fusionar.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · pruebas de Python
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml
      - name: OCR (Tesseract y Poppler) para las pruebas de documentos escaneados
        timeout-minutes: 10          # un espejo de apt colgado no debe dejar el trabajo parado hasta el límite del job
        run: |
          aptq() { sudo timeout --kill-after=10 150 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 "$@"; }
          for intento in 1 2 3; do
            if aptq update && aptq install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa tesseract-ocr-cat tesseract-ocr-eng poppler-utils; then exit 0; fi
            echo "apt falló (intento $intento de 3)"; sleep 5
          done
          exit 1
      - name: Instalar la API
        run: pip install -e ./api
      - name: Pruebas
        working-directory: api
        run: python -m unittest discover -s tests
      - name: Voz (cambio a CPU si falla la tarjeta gráfica, sin cargar modelos)
        working-directory: servicios/voz
        run: |
          pip install python-multipart
          python -m unittest discover -s tests

  panel:
    name: Panel · pruebas de Node
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar
        working-directory: panel
        run: npm install --no-audit --no-fund
      - name: Pruebas
        working-directory: panel
        run: node --test test/*.test.mjs

  configuracion:
    name: Configuración · secretos, compose, scripts y fichas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # el historial completo, para buscar secretos en commits antiguos
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar secretos (ficheros e historial)
        run: python3 scripts/comprobar_secretos.py --historial
      - name: docker-compose.yml válido
        run: docker compose --env-file .env.example config -q
      - name: ERPNext (docker-compose) válido
        run: docker compose -f erpnext/docker-compose.yml --env-file .env.example config -q
      - name: Infraestructura de licitaciones (compose) válida
        run: docker compose -f licitaciones/compose.yaml --env-file .env.example config -q
      - name: Licitaciones con el puerto de desarrollo (compose) válido
        run: docker compose -f licitaciones/compose.yaml -f licitaciones/compose.dev.yaml --env-file .env.example config -q
      - name: Licitaciones unidas a la red del Cerebro (compose) válido
        run: docker compose -f licitaciones/compose.yaml -f licitaciones/compose.cerebro.yaml --env-file .env.example config -q
      - name: Sintaxis de los scripts de shell
        run: for f in scripts/*.sh despliegue/*.sh servicios/*/*.sh; do bash -n "$f"; done
      - name: Las fichas de los agentes están al día con scripts/generar_fichas.py
        run: |
          pip install pyyaml
          python3 scripts/generar_fichas.py
          git diff --exit-code -- config docs/AGENTES.md

  licitaciones:
    name: Licitaciones · Go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: licitaciones
    services:
      postgres:                       # base efímera para las pruebas de internal/storage/pg
        image: pgvector/pgvector:pg16      # Postgres 16 con pgvector: las pruebas de la búsqueda por significado
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LICITACIONES_TEST_PG: postgres://postgres:postgres@localhost:5432/lic_test
      LICITACIONES_TEST_S3: localhost:9000
      LICITACIONES_TEST_S3_USER: prueba-s3
      LICITACIONES_TEST_S3_KEY: prueba-s3-clave
    steps:
      - uses: actions/checkout@v4
      - name: RustFS efímero para las pruebas de internal/storage/s3
        working-directory: .
        run: |
          docker run -d --name s3-prueba -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY="$LICITACIONES_TEST_S3_USER" -e RUSTFS_SECRET_KEY="$LICITACIONES_TEST_S3_KEY" \
            -e RUSTFS_VOLUMES=/data -e RUSTFS_ADDRESS=":9000" -e RUSTFS_CONSOLE_ENABLE=false \
            rustfs/rustfs:1.0.4
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/9000) 2>/dev/null && exit 0; sleep 2; done
          docker logs s3-prueba; exit 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: licitaciones/go.mod
          cache-dependency-path: licitaciones/go.sum
      - name: go.mod y go.sum ordenados
        run: go mod tidy -diff
      - name: Formato (gofmt)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go tool staticcheck ./...
      - name: golangci-lint (versión fijada, compilada con el Go del módulo)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$(go env GOPATH)/bin/golangci-lint" run
      - name: Pruebas (detector de carreras, sin caché)
        run: go test -race -count=1 -timeout 10m ./...
      - name: Vulnerabilidades conocidas (govulncheck)
        run: go tool govulncheck ./...
      - name: Imagen (solo construir, sin publicar)
        working-directory: .
        run: docker build -f licitaciones/Dockerfile --build-arg VERSION=${{ github.sha }} -t licitaciones:ci licitaciones
