# NATS JetStream del motor de licitaciones (ADR 0002). Las credenciales llegan por variables de entorno, nunca en este fichero.
server_name: licitaciones
listen: 0.0.0.0:4222
http: 127.0.0.1:8222          # monitorización solo dentro del contenedor (healthcheck); no se publica
jetstream {
  store_dir: /data
  max_file_store: 4GB
  max_memory_store: 256MB
}
authorization {
  user: $NATS_USER
  password: $NATS_PASSWORD
}
max_payload: 1MB
