# Motor de licitaciones: almacén de originales (S3: RustFS), bus de eventos (NATS JetStream), su Postgres y el ingestor (PLACSP).
# Red interna: no se publica ningún puerto ni la consola del almacén. Solo el ingestor sale a Internet (red «salida»), y únicamente a
# contrataciondelestado.es (lista blanca en el propio cliente HTTP).
# Uso: docker compose -f licitaciones/compose.yaml --env-file .env up -d --build
name: licitaciones

x-endurecido: &endurecido
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [interna]

services:
  rustfs:
    <<: *endurecido
    # POR VERIFICAR (ADR 0004): RustFS (Apache 2.0, S3 en Rust, mantenido) sustituye a MinIO, que ya no publica imágenes ni recibe parches.
    # Fijar la etiqueta exacta (o su @sha256) al desplegar. Funciona sobre el contenedor como usuario 10001: el volumen debe ser escribible por él.
    # El código habla S3 estándar: cambiar de almacén es cambiar la imagen o el destino.
    image: "${LIC_S3_IMAGEN:-rustfs/rustfs:1.0.4}"
    environment:
      RUSTFS_ACCESS_KEY: "${LIC_S3_USUARIO:?define LIC_S3_USUARIO}"
      RUSTFS_SECRET_KEY: "${LIC_S3_PASSWORD:?define LIC_S3_PASSWORD}"
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"       # sin consola web; los cubos los crea el ingestor (EnsureBuckets), el de originales con Object Lock
    volumes: ["s3-datos:/data"]
    # Sin healthcheck propio hasta confirmar qué herramientas trae la imagen; el ingestor reintenta la conexión al arrancar.
    mem_limit: 4g                        # con 1 GiB el almacén se caía por falta de memoria durante una carga grande (el entrypoint lo relanzaba y el ingestor veía «service unavailable»)
    cpus: 2.0

  nats:
    <<: *endurecido
    image: "${LIC_NATS_IMAGEN:-nats:2.11-alpine}"      # POR VERIFICAR: etiqueta exacta a fijar al desplegar
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_USER: "${LIC_NATS_USUARIO:?define LIC_NATS_USUARIO}"
      NATS_PASSWORD: "${LIC_NATS_PASSWORD:?define LIC_NATS_PASSWORD}"
    volumes: ["nats-datos:/data", "./deploy/nats.conf:/etc/nats/nats.conf:ro"]
    read_only: true
    tmpfs: ["/tmp"]
    healthcheck: {test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz | grep -q ok"], interval: 5s, timeout: 5s, retries: 20}
    mem_limit: 512m
    cpus: 1.0

  lic-db:
    <<: *endurecido
    image: "${LIC_PG_IMAGEN:-pgvector/pgvector:pg16-bookworm}"   # Postgres 16 con pgvector. La etiqueta fija el sistema (glibc 2.36): con «pg16» a secas un cambio de sistema de la imagen avisa de «collation version mismatch» y obliga a reindexar
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]      # lo que necesita el arranque de la imagen oficial; el resto sigue quitado
    environment:
      POSTGRES_USER: lic
      POSTGRES_DB: licitaciones
      POSTGRES_PASSWORD: "${LIC_PG_PASSWORD:?define LIC_PG_PASSWORD}"
    volumes: ["pg-datos:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U lic -d licitaciones"], interval: 5s, timeout: 5s, retries: 20}
    mem_limit: 2g                        # la carga del histórico escribe cientos de miles de filas (y sus índices y adjudicaciones derivadas)
    cpus: 2.0

  ingestor:
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [interna, salida]
    build: {context: ., dockerfile: Dockerfile, args: {VERSION: "${LIC_VERSION:-local}"}}
    image: licitaciones:local
    entrypoint: ["/ingestor"]
    read_only: true
    tmpfs: ["/tmp"]
    depends_on: {lic-db: {condition: service_healthy}}
    environment:
      LICITACIONES_ADDR: "0.0.0.0:8081"                  # /healthz solo dentro de la red interna
      LIC_PG_URL: "postgres://lic:${LIC_PG_PASSWORD}@lic-db:5432/licitaciones?sslmode=disable"
      LIC_S3_ENDPOINT: rustfs:9000
      LIC_S3_USUARIO: "${LIC_S3_USUARIO}"
      LIC_S3_PASSWORD: "${LIC_S3_PASSWORD}"
      LIC_NATS_URL: nats://nats:4222
      LIC_NATS_USUARIO: "${LIC_NATS_USUARIO}"
      LIC_NATS_PASSWORD: "${LIC_NATS_PASSWORD}"
      LIC_FUENTES: "${LIC_FUENTES:-placsp-643}"
      LIC_INTERVALO: "${LIC_INTERVALO:-1h}"
      LIC_TIMEOUT_DESCARGA: "${LIC_TIMEOUT_DESCARGA:-5m}"
      LIC_CONTACTO: "${LIC_CONTACTO:-}"
      LIC_HISTORICO_DESDE: "${LIC_HISTORICO_DESDE:-}"       # vacío = sin histórico; p. ej. 2023 o 2023-06
      LIC_HISTORICO_DIR: /scratch
      LIC_TIMEOUT_ZIP: "${LIC_TIMEOUT_ZIP:-30m}"
    volumes: ["historico-tmp:/scratch"]                    # aquí se baja cada ZIP (hasta unos GB) y se borra al terminarlo
    mem_limit: 256m
    cpus: 0.5

  proyector:
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [interna]                                 # sin salida a Internet: solo lee del almacén y del bus y escribe en su base
    image: licitaciones:local                           # la misma imagen que construye el ingestor
    entrypoint: ["/proyector"]
    read_only: true
    tmpfs: ["/tmp"]
    depends_on: {lic-db: {condition: service_healthy}, ingestor: {condition: service_started}}
    environment:
      LICITACIONES_ADDR: "0.0.0.0:8081"
      LIC_PG_URL: "postgres://lic:${LIC_PG_PASSWORD}@lic-db:5432/licitaciones?sslmode=disable"
      LIC_S3_ENDPOINT: rustfs:9000
      LIC_S3_USUARIO: "${LIC_S3_USUARIO}"
      LIC_S3_PASSWORD: "${LIC_S3_PASSWORD}"
      LIC_NATS_URL: nats://nats:4222
      LIC_NATS_USUARIO: "${LIC_NATS_USUARIO}"
      LIC_NATS_PASSWORD: "${LIC_NATS_PASSWORD}"
    mem_limit: 256m
    cpus: 0.5

  vectorizador:
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [interna]                                 # sin salida a Internet; para llegar a Ollama se une a la red del Cerebro (compose.cerebro.yaml)
    image: licitaciones:local
    entrypoint: ["/vectorizador"]
    read_only: true
    tmpfs: ["/tmp"]
    depends_on: {lic-db: {condition: service_healthy}}
    environment:
      LICITACIONES_ADDR: "0.0.0.0:8081"
      LIC_PG_URL: "postgres://lic:${LIC_PG_PASSWORD}@lic-db:5432/licitaciones?sslmode=disable"
      LIC_OLLAMA_URL: "${LIC_OLLAMA_URL:-}"              # vacío = sin búsqueda por significado
    mem_limit: 128m
    cpus: 0.25

  api:
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [interna]                                 # sin salida a Internet y sin puertos publicados (para probar en local: compose.dev.yaml)
    image: licitaciones:local
    entrypoint: ["/api"]
    read_only: true
    tmpfs: ["/tmp"]
    depends_on: {lic-db: {condition: service_healthy}, proyector: {condition: service_started}}
    environment:
      LICITACIONES_ADDR: "0.0.0.0:8080"
      LIC_PG_URL: "postgres://lic:${LIC_PG_PASSWORD}@lic-db:5432/licitaciones?sslmode=disable"
      LIC_API_TOKEN: "${LIC_API_TOKEN:?define LIC_API_TOKEN (mínimo 32 caracteres: openssl rand -hex 32)}"
      LIC_OLLAMA_URL: "${LIC_OLLAMA_URL:-}"              # para vectorizar la consulta del usuario; vacío = solo búsqueda de texto
    mem_limit: 256m
    cpus: 0.5

networks:
  interna: {internal: true}      # sin salida a Internet ni acceso desde fuera
  salida: {}                     # solo el ingestor, para descargar de PLACSP

volumes:
  s3-datos:
  pg-datos:
  nats-datos:
  historico-tmp:                 # carpeta de trabajo del ingestor para los ZIP del histórico (ver README, «Histórico antiguo»)
