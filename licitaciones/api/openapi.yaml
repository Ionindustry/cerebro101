openapi: 3.1.0
info:
  title: API del motor de licitaciones (101.cat)
  version: 0.2.0-borrador
  summary: Búsqueda de licitaciones, adjudicaciones, competencia, alertas y simulador de ofertas.
  description: |
    **Borrador de la fase 0** (26/10/2026). Contrato entre el motor (Go, `cmd/api`) y sus clientes: el panel del Cerebro
    (a través de su pasarela) y la herramienta `licitaciones` de los agentes. Ver `licitaciones/adr/0007-integracion-con-el-cerebro.md`.

    **Estado de la implementación (27/10/2026, ADR 0009):** `cmd/api` sirve hoy `/tenders`, `/tenders/{id}` y `/ops/status` (subconjunto) sobre
    un modelo de lectura en Postgres, con un token compartido en lugar de Keycloak. De `/tenders` aún no existen `area`, `facetas`, `encaje_min`,
    `publicada_desde/hasta`, `orden=encaje|publicacion` ni el filtro `comprador` por UUID (solo `nif:` y `dir3:`): dan 400 `parametro_invalido`.
    `/awards` y `/competitors` también están (adjudicaciones por lote y ranking de adjudicatarios del mercado); en ellos aún no existen `area` ni `confianza`, `adjudicatario`
    solo admite el UUID de la organización o `nif:`, y `baja` es `null` cuando el presupuesto del lote no es fiable (varios adjudicatarios en el mismo lote, lo adjudicado
    supera el presupuesto o no hay presupuesto). `/competitors` solo cuenta lo adjudicado en euros.
    `/expiring-contracts` también está: la fecha de fin es inicio + duración prevista − 1 día (inicio = entrada en vigor publicada, si no la formalización, si no la
    adjudicación; `confianza` 0,9 / 0,7 / 0,4); `prorrogas_posibles` y `fecha_fin_con_prorrogas` solo se rellenan cuando el texto del pliego lo dice con claridad (si no,
    `null`, y el texto original va en `prorrogas_texto`, campo añadido al contrato). No admite `area`.
    `/organizations/{id}` también está (ficha de comprador y de proveedor con estadísticas): `id` es el UUID que dan las listas, `nif:` o `dir3:` (un NIF o un DIR3
    dan el mismo UUID que calculan las listas; `vat:` da 400); `desde`, `hasta` (fecha de adjudicación) y `cpv` acotan las estadísticas, no la existencia; solo cuenta
    lo adjudicado en euros; `por_cpv` agrupa por grupo de 5 cifras y su `cuota` es la proporción de contratos; `cuota` de `principales_adjudicatarios` es sobre el importe;
    los `nombres_alternativos` son informativos y nunca se usan para unir organizaciones.
    Sin implementar: `/tenders/{id}/history`, `/alerts`, `/simulations`, `/dashboard/*`.

    Convenciones:
    - Solo en la red interna; **no se publica fuera** (ADR 0007).
    - Autenticación: token de Keycloak (realm `cerebro`) con audiencia `licitaciones-api`. Autorización por grupo
      (departamento) y rol en cada endpoint; la matriz está en ADR 0007 y se resume en cada operación (`x-permisos`).
    - Paginación **por cursor** (`limit` + `cursor` opaco). Sin `offset`. `limit` máximo 100.
    - Importes como **texto decimal** (sin coma flotante) con moneda, impuestos y significado (`Importe`).
    - Fechas en RFC 3339; fechas sin hora como `YYYY-MM-DD` (zona Europe/Madrid salvo que se indique).
    - Errores en `application/problem+json` (RFC 9457).
    - Los campos de texto en castellano; los identificadores en minúsculas con guion bajo.
    - Los campos de CODICE/eForms se fijan con el corpus real (`licitaciones/testdata`); los marcados «POR VERIFICAR»
      pueden cambiar antes de la v1.
    - `x-fase`: fase del proyecto en la que se implementa el endpoint (§10). `x-cache`: clave y TTL en Redis (ADR 0005).
    - **Dashboard** (§8 «Interfaz y dashboard»): un endpoint por bloque (`/dashboard/opportunities`, `/dashboard/market`,
      `/ops/status`); el bloque «Embudo propio» lo sirve la API del Cerebro, no el motor (ADR 0007 §4). Cada cifra lleva un
      `enlace` con los filtros exactos del listado que la origina.
  contact:
    name: Equipo del motor de licitaciones
servers:
  - url: http://licitaciones-api:8080/api/v1
    description: Red interna Docker (producción y desarrollo)
  - url: http://127.0.0.1:8090/api/v1
    description: Desarrollo local (solo 127.0.0.1)
security:
  - bearer: []
tags:
  - name: licitaciones
    description: Búsqueda, ficha e historial de expedientes
  - name: adjudicaciones
    description: Adjudicaciones y contratos
  - name: competencia
    description: Organismos, competidores y contratos que vencen
  - name: alertas
    description: Alertas guardadas
  - name: simulador
    description: Simulación de presentación de ofertas (§6 del proyecto)
  - name: dashboard
    description: Agregados del dashboard de la sección «Licitaciones» del panel (§8, ADR 0007 §4)
  - name: operaciones
    description: Estado del motor (indicadores operativos del §11)

paths:
  /tenders:
    get:
      tags: [licitaciones]
      operationId: buscarLicitaciones
      summary: Buscar licitaciones (texto, CPV, zona, organismo, fechas, estado)
      description: |
        Búsqueda híbrida (BM25 + semántica) sobre el índice `tenders` (un documento por expediente y lote).
        Sin `q`, ordena por `orden`. Paginación con `search_after` codificado en `cursor`; sin consistencia entre páginas
        si el índice cambia entretanto (se documenta, no se garantiza).
        `novedades_desde` de la herramienta de los agentes = `actualizada_desde` + `orden=actualizacion`.
      x-permisos: grupos licitaciones, direccion, comercial, telecom, areas; cuenta servicio
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/cpv'
        - $ref: '#/components/parameters/area'
        - $ref: '#/components/parameters/nuts'
        - $ref: '#/components/parameters/comprador'
        - name: estado
          in: query
          description: Estado normalizado (varios valores = O).
          style: form
          explode: true
          schema:
            type: array
            maxItems: 7
            items: {$ref: '#/components/schemas/EstadoLicitacion'}
        - name: procedimiento
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items: {$ref: '#/components/schemas/Procedimiento'}
        - $ref: '#/components/parameters/fuente'
        - name: id_origen
          in: query
          description: |
            Identificador del expediente en la fuente (el `id_origen` de los eventos). Solo es único dentro de su fuente, así que **exige exactamente una `fuente`**
            (400 si no). Lo usa el consumidor de eventos del Cerebro para pasar de un evento a su expediente. Implementado.
          schema: {type: string, minLength: 1, maxLength: 500}
        - $ref: '#/components/parameters/importe_min'
        - $ref: '#/components/parameters/importe_max'
        - name: publicada_desde
          in: query
          schema: {type: string, format: date-time}
        - name: publicada_hasta
          in: query
          schema: {type: string, format: date-time}
        - name: actualizada_desde
          in: query
          description: Expedientes con alguna versión nueva desde esta fecha (para «novedades desde»).
          schema: {type: string, format: date-time}
        - name: plazo_desde
          in: query
          description: Fin del plazo de presentación a partir de esta fecha.
          schema: {type: string, format: date-time}
        - name: plazo_hasta
          in: query
          schema: {type: string, format: date-time}
        - name: encaje_min
          in: query
          description: Puntuación mínima de encaje para 101.cat (0–100).
          schema: {type: number, minimum: 0, maximum: 100}
        - name: orden
          in: query
          schema:
            type: string
            enum: [relevancia, encaje, plazo, publicacion, actualizacion, importe]
            default: relevancia
        - name: modo
          in: query
          description: |
            Cómo se busca `q`. `texto` (por defecto): palabras exactas en castellano y catalán. `significado`: por parecido de sentido (vectores bge-m3 en pgvector),
            aunque no compartan palabras; cada resultado trae `cercania` (0–1). `hibrido`: mezcla de las dos (fusión por rangos recíprocos). `significado` e `hibrido`
            necesitan `q`, no se paginan (sin `cursor`) y ordenan por cercanía. Si la búsqueda por significado no está disponible, `significado` responde 503 e `hibrido`
            devuelve la búsqueda de texto con `modo: texto` y un `aviso`. Implementado.
          schema: {type: string, enum: [texto, significado, hibrido], default: texto}
        - name: facetas
          in: query
          description: Facetas a devolver (solo en la primera página).
          style: form
          explode: false
          schema:
            type: array
            maxItems: 6
            items: {type: string, enum: [cpv, nuts, estado, procedimiento, comprador, fuente]}
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Página de resultados
          headers:
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/LicitacionResumen'}
                      facetas:
                        type: object
                        additionalProperties:
                          type: array
                          items: {$ref: '#/components/schemas/Faceta'}
        '400': {$ref: '#/components/responses/Invalida'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '429': {$ref: '#/components/responses/DemasiadasPeticiones'}
        '503': {$ref: '#/components/responses/NoDisponible'}

  /tenders/{id}/parecidas:
    get:
      tags: [licitaciones]
      operationId: licitacionesParecidas
      summary: Licitaciones parecidas a un expediente (por significado, con el porqué)
      description: |
        Los expedientes más cercanos en significado al dado (sin incluirlo), de más a menos parecido. Cada uno trae `cercania` (0–1) y `motivos`:
        `mismo_comprador` (mismo NIF de comprador) y/o `cpv_comun` (comparten algún código CPV). Responde 503 si la búsqueda por significado no está activada o
        el expediente aún no se ha vectorizado. Implementado.
      x-permisos: grupos licitaciones, direccion, comercial, telecom, areas; cuenta servicio
      parameters:
        - $ref: '#/components/parameters/tenderId'
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        '200':
          description: Parecidas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/LicitacionResumen'}
        '400': {$ref: '#/components/responses/Invalida'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '429': {$ref: '#/components/responses/DemasiadasPeticiones'}
        '503': {$ref: '#/components/responses/NoDisponible'}

  /tenders/estadisticas:
    get:
      tags: [licitaciones]
      operationId: licitacionesEstadisticas
      summary: Agregados de todo lo que cumple una búsqueda (dashboard)
      description: |
        Cifras y repartos de TODOS los expedientes que cumplen los filtros (no solo los de una página): total, importe, abiertas, las que vencen en 7 días, y los repartos por
        estado, zona (provincia NUTS 3 del primer lugar de ejecución), división CPV (2 cifras del primer código), tramo de importe, principales compradores y plazos de
        los próximos 60 días (por día, hora de Madrid). Admite los mismos filtros que `/tenders` (el orden, el cursor y el límite no cuentan; `modo` se ignora: se
        agrega por palabras). Los importes son el valor estimado sin IVA, en euros. Un reparto sin resultados es una lista vacía. Implementado.
      x-permisos: grupos licitaciones, direccion, comercial, telecom, areas; cuenta servicio
      parameters:
        - {name: q, in: query, schema: {type: string, minLength: 2, maxLength: 200}}
        - {name: cpv, in: query, style: form, explode: false, schema: {type: array, items: {type: string}}}
        - {name: nuts, in: query, style: form, explode: false, schema: {type: array, items: {type: string}}}
        - {name: estado, in: query, style: form, explode: false, schema: {type: array, items: {$ref: '#/components/schemas/EstadoLicitacion'}}}
        - {name: importe_min, in: query, schema: {type: string}}
        - {name: importe_max, in: query, schema: {type: string}}
        - {name: plazo_hasta, in: query, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Agregados
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Estadisticas'}
        '400': {$ref: '#/components/responses/Invalida'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '429': {$ref: '#/components/responses/DemasiadasPeticiones'}

  /tenders/{id}:
    get:
      tags: [licitaciones]
      operationId: fichaLicitacion
      summary: Ficha completa de un expediente (precalculada)
      description: Lectura por id desde Redis/OpenSearch, sin tocar el grafo ni S3 (SLO p95 < 75 ms). Admite `If-None-Match`.
      x-permisos: grupos licitaciones, direccion, comercial, telecom, areas; cuenta servicio
      parameters:
        - $ref: '#/components/parameters/tenderId'
        - name: If-None-Match
          in: header
          schema: {type: string}
      responses:
        '200':
          description: Ficha
          headers:
            ETag:
              description: '"<uuid>-v<version_entidad>"'
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LicitacionFicha'}
        '304': {description: Sin cambios desde el ETag indicado}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '429': {$ref: '#/components/responses/DemasiadasPeticiones'}

  /tenders/{id}/history:
    get:
      tags: [licitaciones]
      operationId: historialLicitacion
      summary: Versiones del expediente con su evidencia (original en S3, hash, URL, parser)
      x-permisos: grupos licitaciones, direccion, comercial, telecom, areas; cuenta servicio
      parameters:
        - $ref: '#/components/parameters/tenderId'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Versiones, de la más reciente a la más antigua
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/VersionLicitacion'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '429': {$ref: '#/components/responses/DemasiadasPeticiones'}

  /awards:
    get:
      tags: [adjudicaciones]
      operationId: buscarAdjudicaciones
      summary: Adjudicaciones por lote (para análisis de mercado y precios)
      x-permisos: grupos licitaciones, direccion, comercial, telecom, areas; cuenta servicio. NIF de personas físicas solo para licitaciones y direccion
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/cpv'
        - $ref: '#/components/parameters/area'
        - $ref: '#/components/parameters/nuts'
        - $ref: '#/components/parameters/comprador'
        - name: adjudicatario
          in: query
          description: Id de organización (`OrganizacionId`).
          schema: {$ref: '#/components/schemas/OrganizacionId'}
        - $ref: '#/components/parameters/fuente'
        - $ref: '#/components/parameters/importe_min'
        - $ref: '#/components/parameters/importe_max'
        - name: adjudicada_desde
          in: query
          schema: {type: string, format: date}
        - name: adjudicada_hasta
          in: query
          schema: {type: string, format: date}
        - name: resultado
          in: query
          description: Sin indicar, ambos. El dashboard enlaza con `resultado=adjudicado` o `resultado=desierto`.
          schema: {type: string, enum: [adjudicado, desierto]}
        - name: procedimiento
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items: {$ref: '#/components/schemas/Procedimiento'}
        - name: orden
          in: query
          schema: {type: string, enum: [fecha, importe, baja], default: fecha}
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Página de adjudicaciones
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Adjudicacion'}
        '400': {$ref: '#/components/responses/Invalida'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '429': {$ref: '#/components/responses/DemasiadasPeticiones'}

  /organizations/{id}:
    get:
      tags: [competencia]
      operationId: fichaOrganizacion
      summary: Ficha de organismo (comprador) o de competidor (proveedor) con estadísticas
      description: |
        `id` admite el UUID interno o un identificador oficial con prefijo: `nif:B12345678`, `dir3:L01080193`,
        `vat:FR12345678901`. Nunca se busca por nombre.
      x-permisos: compradores como /tenders; proveedores solo licitaciones, direccion y servicio (acceso registrado)
      parameters:
        - name: id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/OrganizacionId'}
        - name: desde
          in: query
          description: Inicio del periodo de las estadísticas (por defecto, hace 5 años).
          schema: {type: string, format: date}
        - name: hasta
          in: query
          schema: {type: string, format: date}
        - $ref: '#/components/parameters/cpv'
      responses:
        '200':
          description: Ficha
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organizacion'}
        '400': {$ref: '#/components/responses/Invalida'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '429': {$ref: '#/components/responses/DemasiadasPeticiones'}

  /competitors:
    get:
      tags: [competencia]
      operationId: competidores
      summary: Ranking de competidores en un mercado (CPV, zona, organismo, importe, periodo)
      description: Al menos uno de `cpv`, `area`, `nuts` o `comprador` es obligatorio (evita listados masivos).
      x-permisos: licitaciones, direccion; cuenta servicio (acceso registrado)
      parameters:
        - $ref: '#/components/parameters/cpv'
        - $ref: '#/components/parameters/area'
        - $ref: '#/components/parameters/nuts'
        - $ref: '#/components/parameters/comprador'
        - $ref: '#/components/parameters/importe_min'
        - $ref: '#/components/parameters/importe_max'
        - name: desde
          in: query
          schema: {type: string, format: date}
        - name: hasta
          in: query
          schema: {type: string, format: date}
        - name: orden
          in: query
          schema: {type: string, enum: [importe, contratos, cuota], default: importe}
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Competidores
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    required: [items, muestra]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Competidor'}
                      muestra:
                        $ref: '#/components/schemas/Muestra'
        '400': {$ref: '#/components/responses/Invalida'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '429': {$ref: '#/components/responses/DemasiadasPeticiones'}

  /expiring-contracts:
    get:
      tags: [competencia]
      operationId: contratosQueVencen
      summary: Contratos formalizados que terminan en un periodo (el concurso volverá a salir)
      x-permisos: grupos licitaciones, direccion, comercial, telecom, areas; cuenta servicio
      parameters:
        - $ref: '#/components/parameters/cpv'
        - $ref: '#/components/parameters/area'
        - $ref: '#/components/parameters/nuts'
        - $ref: '#/components/parameters/comprador'
        - $ref: '#/components/parameters/importe_min'
        - name: vence_desde
          in: query
          description: Por defecto, hoy + 3 meses.
          schema: {type: string, format: date}
        - name: vence_hasta
          in: query
          description: Por defecto, hoy + 12 meses. Máximo 36 meses desde `vence_desde`.
          schema: {type: string, format: date}
        - name: con_prorrogas
          in: query
          description: Si es true, usa la fecha de fin con las prórrogas posibles.
          schema: {type: boolean, default: false}
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Contratos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/ContratoQueVence'}
        '400': {$ref: '#/components/responses/Invalida'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '429': {$ref: '#/components/responses/DemasiadasPeticiones'}

  # NOTA (alertas): hoy NO se sirven desde el motor sino desde la API del Cerebro (`/licitaciones/alertas`, `/licitaciones/avisos`), que es donde están la identidad de
  # las personas y sus departamentos; el motor solo evalúa el filtro de un expediente (`GET /tenders` con `fuente` + `id_origen`). Este contrato queda como referencia
  # para cuando la API del motor conozca a los usuarios (Keycloak, SEC-031).
  /alerts:
    get:
      tags: [alertas]
      operationId: listarAlertas
      summary: Alertas visibles para el usuario (las suyas y las de sus departamentos)
      x-permisos: cualquier usuario con acceso a /tenders
      parameters:
        - name: ambito
          in: query
          schema: {type: string, enum: [personal, departamento]}
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Alertas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagina'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Alerta'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
    post:
      tags: [alertas]
      operationId: crearAlerta
      summary: Crear una alerta
      x-permisos: personal, cualquier usuario con acceso; departamento, rol responsable de ese departamento o direccion
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertaEntrada'}
      responses:
        '201':
          description: Creada
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Alerta'}
        '400': {$ref: '#/components/responses/Invalida'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '409': {$ref: '#/components/responses/Conflicto'}
        '422': {$ref: '#/components/responses/NoProcesable'}

  /alerts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [alertas]
      operationId: verAlerta
      summary: Ver una alerta
      responses:
        '200':
          description: Alerta
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Alerta'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
    patch:
      tags: [alertas]
      operationId: cambiarAlerta
      summary: Cambiar una alerta (JSON Merge Patch)
      parameters:
        - name: If-Match
          in: header
          required: true
          description: ETag de la alerta (evita pisar cambios de otra persona).
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/AlertaCambio'}
      responses:
        '200':
          description: Alerta cambiada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Alerta'}
        '400': {$ref: '#/components/responses/Invalida'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '412': {$ref: '#/components/responses/PrecondicionFallida'}
    delete:
      tags: [alertas]
      operationId: borrarAlerta
      summary: Borrar una alerta
      responses:
        '204': {description: Borrada}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}

  /simulations:
    post:
      tags: [simulador]
      operationId: simular
      summary: Simular la presentación de una oferta (curva probabilidad-precio-margen)
      description: |
        Cálculo **determinista** (Monte Carlo con `semilla`) en `internal/simulation`; objetivo < 1 s para 10 000
        escenarios. Exige reglas del pliego **validadas por una persona** (`reglas.validadas_por`). No decide: devuelve
        la curva, el riesgo de baja anormal, la incertidumbre y si el simulador es apto para decidir según su
        *backtesting*. La simulación se guarda (entrada y resultado) y solo la ve el departamento que la pidió.
      x-permisos: licitaciones, direccion; cuenta servicio
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulacionEntrada'}
      responses:
        '201':
          description: Simulación hecha
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Simulacion'}
        '400': {$ref: '#/components/responses/Invalida'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}
        '422': {$ref: '#/components/responses/NoProcesable'}
        '429': {$ref: '#/components/responses/DemasiadasPeticiones'}

  /simulations/{id}:
    get:
      tags: [simulador]
      operationId: verSimulacion
      summary: Ver una simulación guardada
      x-permisos: departamento que la pidió (licitaciones, direccion); cuenta servicio
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Simulación
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Simulacion'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '404': {$ref: '#/components/responses/NoEncontrado'}

  /dashboard/opportunities:
    get:
      tags: [dashboard]
      operationId: dashboardOportunidades
      summary: Bloque «Oportunidades» del dashboard (licitaciones nuevas, encaje alto, importes, plazos, reparto)
      description: |
        **Universo**: lotes del índice `tenders` (un documento por expediente y lote, como `/tenders`) de **nuestras
        áreas** (cualquier `AreaCpv`) y **España** (`nuts=ES`). La unidad de cuenta es el **lote**: así cada cifra coincide
        con el `total` del listado enlazado.

        - `nuevas`: publicados dentro de `ventana` (`publicada_desde = ventana.desde`).
        - `nuevas_encaje_alto`: además, `encaje ≥ umbral_encaje_alto` (configuración `LIC_ENCAJE_ALTO`; 70 POR VALIDAR).
        - `importe_total`: suma del **presupuesto base de licitación sin IVA** de cada lote, en EUR (el mismo importe al
          que se aplica el límite de 1 M€, §12.4). Los lotes sin ese dato no se suman y se cuentan en `lotes_sin_importe`;
          nunca se mezclan significados ni impuestos.
        - `cierran_7_dias`: lotes `abierta` cuyo plazo de presentación termina entre `calculado_en` y +7 días (no depende
          del periodo).
        - `por_area` y `por_provincia`: reparto de `nuevas` (y su parte con encaje alto). Provincia = NUTS 3; los lotes
          publicados solo con `ES`, NUTS 1/2 o `ESZZZ` van al cubo `nuts: null` (sin enlace propio).

        Agregaciones de OpenSearch sobre campos **precalculados en la proyección** (`areas`, `nuts` con sus ancestros,
        `provincia`, `encaje`, importe en céntimos); sin *scripts*, sin grafo ni S3. Respuesta cacheada en Redis.
        Garantía comprobable: con la misma generación del índice, `Cifra.valor` = `total.valor` del `enlace` (pruebas de
        contrato en la fase 3).
      x-fase: 3
      x-permisos: como /tenders (grupos licitaciones, direccion, comercial, telecom, areas; cuenta servicio)
      x-cache: '`lic:dash:op:{g_tenders}:{periodo}:{franja_5min}`, TTL 5 min (ADR 0005). Igual para todos los usuarios con permiso: no contiene datos personales.'
      parameters:
        - $ref: '#/components/parameters/periodo'
      responses:
        '200':
          description: Agregados del bloque
          headers:
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardOportunidades'}
        '400': {$ref: '#/components/responses/Invalida'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '429': {$ref: '#/components/responses/DemasiadasPeticiones'}
        '503': {$ref: '#/components/responses/NoDisponible'}

  /dashboard/market:
    get:
      tags: [dashboard]
      operationId: dashboardMercado
      summary: Bloque «Competencia y mercado» del dashboard (adjudicaciones, competidores, bajas, contratos que vencen)
      description: |
        **Universo**: adjudicaciones por lote del índice `awards` de nuestras áreas y España (como el bloque anterior).

        - `adjudicaciones`: con `fecha_adjudicacion` dentro de `ventana` (el periodo elegido).
        - `top_competidores`, `mercado_total` y `bajas_por_area`: sobre `ventana_mercado`, **12 meses cerrados** hasta
          ayer, sea cual sea el periodo (con 7 días no hay muestra para hablar de cuotas ni de bajas). Cuota = importe
          adjudicado sin IVA del competidor / `mercado_total`. Una baja fuera de [−0,20; 0,80] se excluye como probable
          error de dato (IVA mezclado, importe mal publicado) y se cuenta en `excluidas` (umbrales POR VALIDAR con
          Licitaciones). Con menos de `minimo_muestra` adjudicaciones, la baja es `null`.
        - `contratos_que_vencen`: `fecha_fin_contrato` entre hoy + 3 meses y hoy + 12 meses (sin prórrogas), como los
          valores por defecto de `/expiring-contracts`.

        Si el usuario no puede ver competidores (`/competitors`), `alcance = sin_competidores` y `top_competidores` es
        `null`; en `adjudicaciones.ultimas`, el NIF de personas físicas sigue las reglas de `/awards`. La clave de caché
        incluye el alcance (ADR 0005: dos permisos distintos nunca comparten entrada).
      x-fase: 4
      x-permisos: como /awards; top_competidores solo licitaciones, direccion y cuenta servicio (acceso registrado, como /competitors)
      x-cache: '`lic:dash:mer:{g_awards}:{periodo}:{alcance}:{dia}`, TTL 15 min (ADR 0005)'
      parameters:
        - $ref: '#/components/parameters/periodo'
      responses:
        '200':
          description: Agregados del bloque
          headers:
            RateLimit-Remaining: {$ref: '#/components/headers/RateLimit-Remaining'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardMercado'}
        '400': {$ref: '#/components/responses/Invalida'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '429': {$ref: '#/components/responses/DemasiadasPeticiones'}
        '503': {$ref: '#/components/responses/NoDisponible'}

  /ops/status:
    get:
      tags: [operaciones]
      operationId: estadoMotor
      summary: Estado del motor (frescura por fuente, ingestas, parsers, colas de NATS, salud de los almacenes)
      description: |
        Devuelve la **última instantánea** que un comprobador en segundo plano de `cmd/api` toma cada 15 s (consultas en
        paralelo con 1 s de plazo cada una): `ingestion_runs` en Postgres (lo escribe el consumidor `ops`, ADR 0002),
        monitorización de NATS (`:8222/jsz`), `_cluster/health` de OpenSearch, `RETURN 1` en el grafo,
        `/minio/health/live` y `PING` a Redis. La petición **no espera** a ningún almacén y **no usa Redis** (tiene que
        poder decir que Redis está caído): responde en milisegundos aunque todo lo demás falle.

        Siempre 200 mientras la API viva, también con `estado = caido`. Si la instantánea tiene más de 60 s (el
        comprobador se ha parado), `estado = caido` con el motivo `instantanea_antigua`. Si la API no responde, la pasarela
        devuelve 502/504 y el panel lo pinta como caído. El panel **no** muestra cifras de un bloque cuando este endpoint
        dice `caido`.

        Reglas del estado global (umbrales en `umbrales`, configurables, POR VALIDAR en la fase 3):
        - `caido`: OpenSearch no responde o en rojo; instantánea antigua; o ninguna de las fuentes principales
          (`placsp`, `placsp_agregadas`) con una ingesta correcta en `umbrales.fuente_caida_s` (6 h).
        - `degradado`: cualquier fuente fuera del objetivo de frescura (2 h, §11); OpenSearch en amarillo; grafo, MinIO,
          Redis, NATS o Postgres sin responder (la lectura sigue funcionando); un consumidor por encima de su umbral de
          retraso (ADR 0002: `proy-busqueda` > 15 min o > 5 000 mensajes); mensajes en la DLQ en la última hora; tasa
          de errores de parser > `umbrales.errores_parser_tasa` en 24 h.
        - `ok`: nada de lo anterior.

        Dos alcances: `resumen` (estado global, motivos, fuentes y estado de cada componente) para todos los que ven el
        dashboard; `detalle` (además consumidores, DLQ, proyecciones e indicadores de cada componente) para quien opera.
        Nunca incluye nombres de host, IP, credenciales ni mensajes de error crudos.
      x-fase: 3
      x-permisos: resumen como /tenders; detalle rol direccion, grupo tecnologia, rol responsable del grupo licitaciones y cuenta servicio
      x-cache: Sin Redis. Instantánea en memoria del proceso (cada 15 s).
      responses:
        '200':
          description: Estado del motor
          headers:
            Cache-Control:
              description: '`no-store`'
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EstadoMotor'}
        '401': {$ref: '#/components/responses/NoAutenticado'}
        '403': {$ref: '#/components/responses/Prohibido'}
        '429': {$ref: '#/components/responses/DemasiadasPeticiones'}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de acceso de Keycloak, realm `cerebro`. Se valida firma (RS256, JWKS), `iss`, `aud` ∋ `licitaciones-api`,
        `exp`/`nbf` (±30 s) y `azp` ∈ {`cerebro-panel`, `cerebro-agentes`}. Roles: `realm_access.roles`;
        departamentos: `groups`.

  headers:
    RateLimit-Remaining:
      description: Peticiones que quedan en la ventana actual.
      schema: {type: integer, minimum: 0}
    Retry-After:
      description: Segundos que hay que esperar.
      schema: {type: integer, minimum: 1}

  parameters:
    q:
      name: q
      in: query
      description: Texto libre (castellano o catalán). Se trata como texto, nunca como sintaxis de consulta.
      schema: {type: string, minLength: 2, maxLength: 200}
    cpv:
      name: cpv
      in: query
      description: |
        Códigos CPV de 8 cifras o prefijos (2–8 cifras; un prefijo incluye los descendientes). Varios = O.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items: {type: string, pattern: '^[0-9]{2,8}$'}
    nuts:
      name: nuts
      in: query
      description: Códigos NUTS (p. ej. `ES51` Cataluña, `ES512` Girona). Un código incluye sus subniveles. Varios = O.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items: {type: string, pattern: '^[A-Z]{2}[0-9A-Z]{0,3}$'}
    comprador:
      name: comprador
      in: query
      description: Organismo comprador (`OrganizacionId`). Varios = O.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items: {$ref: '#/components/schemas/OrganizacionId'}
    fuente:
      name: fuente
      in: query
      style: form
      explode: true
      schema:
        type: array
        maxItems: 5
        items: {$ref: '#/components/schemas/Fuente'}
    importe_min:
      name: importe_min
      in: query
      description: Importe mínimo en euros, sin IVA, sobre el valor estimado (licitaciones) o el adjudicado (adjudicaciones).
      schema: {type: string, pattern: '^[0-9]{1,12}(\.[0-9]{1,2})?$'}
    importe_max:
      name: importe_max
      in: query
      schema: {type: string, pattern: '^[0-9]{1,12}(\.[0-9]{1,2})?$'}
    limit:
      name: limit
      in: query
      description: Tamaño de página. Más de 100 → 400 (no se recorta en silencio).
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    cursor:
      name: cursor
      in: query
      description: |
        Cursor opaco devuelto en `siguiente_cursor`. Firmado (HMAC) y ligado a los filtros de la consulta: usarlo con
        otros filtros devuelve 400 `cursor_invalido`. Caduca a las 24 h.
      schema: {type: string, maxLength: 1024, pattern: '^[A-Za-z0-9_-]+$'}
    area:
      name: area
      in: query
      description: Área de negocio de 101.cat (`AreaCpv`, agrupa los CPV de §12.1). Varios = O. Se combina con `cpv` con Y.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 5
        uniqueItems: true
        items: {$ref: '#/components/schemas/AreaCpv'}
    periodo:
      name: periodo
      in: query
      schema:
        $ref: '#/components/schemas/Periodo'
        default: 7d
    tenderId:
      name: id
      in: path
      required: true
      description: UUID interno y estable del expediente.
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Repetir la petición con la misma clave en 24 h devuelve el mismo resultado sin crear otro recurso.
      schema: {type: string, format: uuid}

  responses:
    Invalida:
      description: Parámetros no válidos (incluye `limit` > 100 y cursor no válido)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    NoAutenticado:
      description: Falta el token o no es válido
      headers:
        WWW-Authenticate: {schema: {type: string}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    Prohibido:
      description: El usuario no tiene permiso para este recurso
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    NoEncontrado:
      description: No existe (o no es visible para el usuario)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    Conflicto:
      description: Conflicto (p. ej. `Idempotency-Key` reutilizada con otro cuerpo)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    PrecondicionFallida:
      description: El recurso ha cambiado (ETag distinto)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    NoProcesable:
      description: Petición bien formada pero imposible (p. ej. reglas del pliego sin validar)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    DemasiadasPeticiones:
      description: |
        Límite de tasa superado. Propuesta inicial por usuario: 10 peticiones/s (ráfaga 20) en búsqueda y fichas;
        2/s en `/awards`, `/competitors`, `/organizations`; 10/min en `/simulations`; 2/s (ráfaga 6) en `/dashboard/*`;
        1/s (ráfaga 3) en `/ops/status`, con contador en memoria del proceso (no depende de Redis).
      headers:
        Retry-After: {$ref: '#/components/headers/Retry-After'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    NoDisponible:
      description: Un almacén necesario no responde (OpenSearch); reintentar más tarde
      headers:
        Retry-After: {$ref: '#/components/headers/Retry-After'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}

  schemas:
    Problema:
      type: object
      description: RFC 9457. `detail` es apto para mostrar a una persona y nunca contiene secretos ni trazas internas.
      required: [type, title, status, codigo]
      properties:
        type: {type: string, format: uri-reference, examples: ['https://licitaciones.101.cat/errores/parametro_invalido']}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string, description: Id de la petición (también en la cabecera `X-Request-Id`).}
        codigo:
          type: string
          enum: [parametro_invalido, cursor_invalido, limite_excedido, no_autenticado, sin_permiso, no_encontrado,
                 conflicto, precondicion_fallida, reglas_sin_validar, datos_insuficientes, demasiadas_peticiones,
                 no_disponible, error_interno]
        errores:
          type: array
          description: Detalle por campo en errores de validación.
          items:
            type: object
            required: [campo, mensaje]
            properties:
              campo: {type: string}
              mensaje: {type: string}

    Pagina:
      type: object
      required: [siguiente_cursor, total]
      properties:
        siguiente_cursor:
          type: [string, 'null']
          description: null en la última página.
        total:
          type: object
          required: [valor, relacion]
          description: Total de resultados; exacto hasta 10 000, después «al menos».
          properties:
            valor: {type: integer, minimum: 0}
            relacion: {type: string, enum: [eq, gte]}

    GrupoEstadistica:
      type: object
      required: [valor, cuenta]
      properties:
        valor: {type: string, description: "Estado, código NUTS, división CPV, tramo (menos_15k, 15k_50k, 50k_200k, 200k_1m, mas_1m, sin_importe), nombre del comprador o fecha AAAA-MM-DD."}
        nif: {type: string, description: Solo en compradores.}
        cuenta: {type: integer, minimum: 0}
        importe: {type: string, description: "Solo en compradores: valor estimado sumado (decimal, EUR sin IVA)."}

    Estadisticas:
      type: object
      required: [total, abiertas, vencen_7_dias, importe, estados, zonas, cpv, importes, compradores, plazos]
      properties:
        total: {type: integer, minimum: 0}
        abiertas: {type: integer, minimum: 0}
        vencen_7_dias: {type: integer, minimum: 0, description: Abiertas o con anuncio previo cuyo plazo termina en los próximos 7 días.}
        importe:
          type: object
          required: [total, medio, con_importe, moneda, impuestos, significado]
          properties:
            total: {type: string}
            medio: {type: string, description: Vacío si ningún expediente tiene valor estimado.}
            con_importe: {type: integer}
            moneda: {type: string}
            impuestos: {type: string}
            significado: {type: string}
        estados: {type: array, items: {$ref: '#/components/schemas/GrupoEstadistica'}}
        zonas: {type: array, maxItems: 12, items: {$ref: '#/components/schemas/GrupoEstadistica'}}
        cpv: {type: array, maxItems: 12, items: {$ref: '#/components/schemas/GrupoEstadistica'}}
        importes: {type: array, items: {$ref: '#/components/schemas/GrupoEstadistica'}}
        compradores: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/GrupoEstadistica'}}
        plazos: {type: array, items: {$ref: '#/components/schemas/GrupoEstadistica'}}

    Faceta:
      type: object
      required: [valor, cuenta]
      properties:
        valor: {type: string}
        etiqueta: {type: string}
        cuenta: {type: integer}

    Fuente:
      type: string
      enum: [placsp, placsp_agregadas, ted, cat, placsp_menores]

    EstadoLicitacion:
      type: string
      description: |
        Estado normalizado. El estado de origen se conserva en `estado_origen` (p. ej. códigos CODICE PUB, EV, ADJ, RES,
        ANUL, PRE — mapeo POR VERIFICAR con el corpus). La plataforma deja una licitación como publicada (PUB) hasta que se
        evalúa, mucho después de terminar el plazo de presentación: una `abierta` cuyo `plazo_presentacion` ya pasó se devuelve
        (y se filtra) como `cerrada`. Se calcula al leer; el estado de origen no cambia.
      enum: [anuncio_previo, abierta, cerrada, adjudicada, formalizada, anulada, desierta]

    Procedimiento:
      type: string
      description: Normalizado; mapeo desde CODICE/eForms POR VERIFICAR.
      enum: [abierto, abierto_simplificado, abierto_simplificado_abreviado, restringido, negociado_con_publicidad,
             negociado_sin_publicidad, dialogo_competitivo, asociacion_innovacion, licitacion_con_negociacion,
             basado_en_acuerdo_marco, menor, otro]

    OrganizacionId:
      type: string
      description: UUID interno o identificador oficial con prefijo (`nif:`, `dir3:`, `vat:`).
      pattern: '^([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}|nif:[0-9A-Z]{9}|dir3:[0-9A-Z]{9,10}|vat:[A-Z]{2}[0-9A-Z]{2,13})$'

    Importe:
      type: object
      description: Un importe siempre con moneda, impuestos y significado (`NORMAS.md`).
      required: [valor, moneda, impuestos, significado]
      properties:
        valor: {type: string, pattern: '^-?[0-9]{1,15}(\.[0-9]{1,4})?$', examples: ['125000.00']}
        moneda: {type: string, pattern: '^[A-Z]{3}$', default: EUR}
        impuestos: {type: string, enum: [sin_iva, con_iva, desconocido]}
        significado:
          type: string
          enum: [valor_estimado, presupuesto_base, adjudicado, oferta_mas_baja, oferta_mas_alta, modificacion, total_con_modificaciones]

    Evidencia:
      type: object
      description: Dónde está el original y cómo se obtuvo (ADR 0003 y 0004).
      required: [fuente, id_origen, url_origen, capturado_en, sha256, clave_raw]
      properties:
        fuente: {$ref: '#/components/schemas/Fuente'}
        id_origen: {type: string}
        url_origen: {type: string, format: uri}
        capturado_en: {type: string, format: date-time}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        clave_raw: {type: string, description: 'Clave en el bucket `raw` (§12.5).'}
        version_parser: {type: string, examples: [codice-v1]}
        licencia: {type: string}

    OrganizacionRef:
      type: object
      required: [id, nombre]
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
        nif:
          type: [string, 'null']
          description: null si es persona física y el usuario no tiene permiso.
        dir3: {type: [string, 'null']}
        persona_fisica: {type: boolean}

    Lote:
      type: object
      required: [numero]
      properties:
        numero: {type: string, description: Número o identificador del lote en origen («1» si no hay lotes).}
        objeto: {type: string}
        cpv: {type: array, items: {type: string, pattern: '^[0-9]{8}$'}}
        nuts: {type: array, items: {type: string}}
        importes: {type: array, items: {$ref: '#/components/schemas/Importe'}}
        estado: {$ref: '#/components/schemas/EstadoLicitacion'}

    LicitacionResumen:
      type: object
      required: [id, titulo, estado, fuentes, version_entidad]
      properties:
        id: {type: string, format: uuid}
        expediente: {type: string, description: Número de expediente del órgano.}
        titulo: {type: string}
        comprador: {$ref: '#/components/schemas/OrganizacionRef'}
        cpv: {type: array, items: {type: string}}
        nuts: {type: array, items: {type: string}}
        procedimiento: {$ref: '#/components/schemas/Procedimiento'}
        estado: {$ref: '#/components/schemas/EstadoLicitacion'}
        importe: {$ref: '#/components/schemas/Importe'}
        publicada_en: {type: string, format: date-time}
        actualizada_en: {type: string, format: date-time}
        plazo_presentacion: {type: [string, 'null'], format: date-time}
        encaje:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: Puntuación de encaje para 101.cat (§7.9); null si no se ha calculado.
        lote: {type: [string, 'null'], description: 'Lote que coincide con la búsqueda, si aplica.'}
        fuentes: {type: array, items: {$ref: '#/components/schemas/Fuente'}}
        url_origen: {type: string, format: uri}
        version_entidad: {type: integer, minimum: 1}
        cercania: {type: number, minimum: 0, maximum: 1, description: "Cuánto se parece a lo buscado; solo con modo=significado y en /parecidas."}
        motivos:
          type: array
          description: Solo en /parecidas.
          items: {type: string, enum: [mismo_comprador, cpv_comun]}
        resaltado:
          type: object
          description: Fragmentos con coincidencias (texto plano; las marcas se indican con desplazamientos, no con HTML).
          additionalProperties:
            type: array
            items: {type: string}

    LicitacionFicha:
      allOf:
        - $ref: '#/components/schemas/LicitacionResumen'
        - type: object
          properties:
            estado_origen: {type: string}
            descripcion: {type: string}
            lotes: {type: array, items: {$ref: '#/components/schemas/Lote'}}
            importes: {type: array, items: {$ref: '#/components/schemas/Importe'}}
            plazos:
              type: object
              properties:
                presentacion: {type: [string, 'null'], format: date-time}
                aclaraciones: {type: [string, 'null'], format: date-time}
                apertura: {type: [string, 'null'], format: date-time}
            criterios:
              type: array
              description: Criterios de adjudicación cuando la fuente los estructura (si no, en el pliego).
              items:
                type: object
                properties:
                  descripcion: {type: string}
                  tipo: {type: string, enum: [precio, calidad_automatica, calidad_juicio_valor, otro]}
                  peso: {type: [number, 'null']}
            documentos:
              type: array
              items:
                type: object
                required: [nombre, url_origen]
                properties:
                  nombre: {type: string}
                  tipo: {type: string, examples: [pliego_administrativo, pliego_tecnico, anuncio, acta]}
                  url_origen: {type: string, format: uri}
                  descargado: {type: boolean}
            adjudicaciones: {type: array, items: {$ref: '#/components/schemas/Adjudicacion'}}
            encaje_detalle:
              type: object
              description: Componentes de la puntuación (CPV, zona, importe, días hasta el cierre, procedimiento).
              additionalProperties: {type: number}
            evidencia: {$ref: '#/components/schemas/Evidencia'}
            relacionados:
              type: array
              description: Expedientes enlazados (PLACSP↔TED) con la evidencia del enlace y su confianza (fase 2).
              items:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  motivo: {type: string}
                  confianza: {type: number, minimum: 0, maximum: 1}

    VersionLicitacion:
      type: object
      required: [version_entidad, tipo_evento, capturado_en, evidencia]
      properties:
        version_entidad: {type: integer, minimum: 1}
        tipo_evento: {type: string, enum: [licitacion.nueva, licitacion.modificada, licitacion.adjudicada, licitacion.formalizada, licitacion.anulada]}
        publicado_en_origen: {type: [string, 'null'], format: date-time}
        capturado_en: {type: string, format: date-time}
        hash_normalizado: {type: string, pattern: '^[0-9a-f]{64}$'}
        cambios:
          type: array
          items:
            type: object
            required: [campo]
            properties:
              campo: {type: string, description: Ruta del campo normalizado (p. ej. `plazos.presentacion`).}
              antes: {}
              despues: {}
        evidencia: {$ref: '#/components/schemas/Evidencia'}

    Adjudicacion:
      type: object
      required: [id, licitacion_id, lote, resultado]
      properties:
        id: {type: string, format: uuid}
        licitacion_id: {type: string, format: uuid}
        expediente: {type: string}
        titulo: {type: string}
        lote: {type: string}
        comprador: {$ref: '#/components/schemas/OrganizacionRef'}
        resultado: {type: string, enum: [adjudicado, desierto]}
        adjudicatario: {$ref: '#/components/schemas/OrganizacionRef'}
        importes:
          type: array
          description: adjudicado (sin y con IVA), presupuesto_base, valor_estimado, ofertas más baja y más alta si se publican.
          items: {$ref: '#/components/schemas/Importe'}
        baja:
          type: [number, 'null']
          description: 1 − adjudicado/presupuesto_base (ambos sin IVA). null si falta un dato.
        ofertas_recibidas: {type: [integer, 'null']}
        baja_anormal: {type: [boolean, 'null']}
        fecha_adjudicacion: {type: [string, 'null'], format: date}
        fecha_formalizacion: {type: [string, 'null'], format: date}
        fecha_fin_contrato: {type: [string, 'null'], format: date}
        procedimiento: {$ref: '#/components/schemas/Procedimiento'}
        cpv: {type: array, items: {type: string}}
        nuts: {type: array, items: {type: string}}
        confianza: {type: number, minimum: 0, maximum: 1, description: Confianza en la extracción del dato.}
        evidencia: {$ref: '#/components/schemas/Evidencia'}

    Muestra:
      type: object
      description: Cuántos datos hay detrás de una estadística (siempre visible, §6).
      required: [adjudicaciones]
      properties:
        adjudicaciones: {type: integer}
        desde: {type: string, format: date}
        hasta: {type: string, format: date}

    EstadisticasMercado:
      type: object
      properties:
        contratos: {type: integer}
        importe_total: {$ref: '#/components/schemas/Importe'}
        baja_media: {type: [number, 'null']}
        baja_p25: {type: [number, 'null']}
        baja_p50: {type: [number, 'null']}
        baja_p75: {type: [number, 'null']}
        ofertas_medias: {type: [number, 'null']}
        por_cpv:
          type: array
          items:
            type: object
            properties:
              cpv: {type: string}
              contratos: {type: integer}
              cuota: {type: number}
        por_trimestre:
          type: array
          items:
            type: object
            properties:
              trimestre: {type: string, pattern: '^[0-9]{4}-T[1-4]$'}
              contratos: {type: integer}
              importe: {$ref: '#/components/schemas/Importe'}
        muestra: {$ref: '#/components/schemas/Muestra'}

    Organizacion:
      type: object
      required: [id, nombre, identificadores, roles]
      properties:
        id: {type: string, format: uuid}
        nombre: {type: string}
        nombres_alternativos: {type: array, items: {type: string}, description: Cómo la escriben los distintos órganos (informativo; nunca se usa para fusionar).}
        identificadores:
          type: array
          items:
            type: object
            required: [esquema, valor]
            properties:
              esquema: {type: string, enum: [NIF, DIR3, VAT, OTRO]}
              valor: {type: string}
        persona_fisica: {type: boolean}
        roles: {type: array, items: {type: string, enum: [comprador, proveedor]}}
        nuts: {type: array, items: {type: string}}
        como_comprador:
          allOf:
            - $ref: '#/components/schemas/EstadisticasMercado'
            - type: object
              properties:
                principales_adjudicatarios:
                  type: array
                  items:
                    type: object
                    properties:
                      organizacion: {$ref: '#/components/schemas/OrganizacionRef'}
                      contratos: {type: integer}
                      cuota: {type: number}
                repeticion_adjudicatario:
                  type: [number, 'null']
                  description: Proporción de contratos adjudicados al adjudicatario más frecuente.
        como_proveedor:
          allOf:
            - $ref: '#/components/schemas/EstadisticasMercado'
            - type: object
              properties:
                principales_compradores:
                  type: array
                  items:
                    type: object
                    properties:
                      organizacion: {$ref: '#/components/schemas/OrganizacionRef'}
                      contratos: {type: integer}

    Competidor:
      type: object
      required: [organizacion, contratos_ganados, cuota]
      properties:
        organizacion: {$ref: '#/components/schemas/OrganizacionRef'}
        contratos_ganados: {type: integer}
        importe_adjudicado: {$ref: '#/components/schemas/Importe'}
        cuota: {type: number, minimum: 0, maximum: 1, description: Cuota por importe adjudicado en el mercado filtrado.}
        baja_media: {type: [number, 'null']}
        baja_p50: {type: [number, 'null']}
        tendencia:
          type: string
          enum: [sube, estable, baja, sin_datos]
        ultima_adjudicacion: {type: [string, 'null'], format: date}

    ContratoQueVence:
      type: object
      required: [adjudicacion_id, licitacion_id, fecha_fin]
      properties:
        adjudicacion_id: {type: string, format: uuid}
        licitacion_id: {type: string, format: uuid}
        expediente: {type: string}
        titulo: {type: string}
        lote: {type: string}
        comprador: {$ref: '#/components/schemas/OrganizacionRef'}
        adjudicatario: {$ref: '#/components/schemas/OrganizacionRef'}
        importe_adjudicado: {$ref: '#/components/schemas/Importe'}
        fecha_formalizacion: {type: [string, 'null'], format: date}
        fecha_fin: {type: string, format: date}
        prorrogas_posibles: {type: [boolean, 'null']}
        fecha_fin_con_prorrogas: {type: [string, 'null'], format: date}
        cpv: {type: array, items: {type: string}}
        nuts: {type: array, items: {type: string}}
        prorrogas_texto: {type: [string, 'null'], description: Texto del pliego sobre las prórrogas, tal cual (dato de un tercero; máx. 1000 caracteres).}
        confianza: {type: number, minimum: 0, maximum: 1, description: Confianza en la fecha de fin (calculada o publicada).}

    FiltroLicitaciones:
      type: object
      description: Los mismos filtros que `GET /tenders` (sin paginación ni orden).
      additionalProperties: false
      properties:
        q: {type: string, minLength: 2, maxLength: 200}
        cpv: {type: array, maxItems: 20, items: {type: string, pattern: '^[0-9]{2,8}$'}}
        area: {type: array, maxItems: 5, uniqueItems: true, items: {$ref: '#/components/schemas/AreaCpv'}}
        nuts: {type: array, maxItems: 20, items: {type: string, pattern: '^[A-Z]{2}[0-9A-Z]{0,3}$'}}
        comprador: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/OrganizacionId'}}
        procedimiento: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/Procedimiento'}}
        fuente: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/Fuente'}}
        importe_min: {type: string, pattern: '^[0-9]{1,12}(\.[0-9]{1,2})?$'}
        importe_max: {type: string, pattern: '^[0-9]{1,12}(\.[0-9]{1,2})?$'}
        encaje_min: {type: number, minimum: 0, maximum: 100}

    AlertaEntrada:
      type: object
      required: [nombre, ambito, filtro, eventos, canal]
      additionalProperties: false
      properties:
        nombre: {type: string, minLength: 1, maxLength: 120}
        ambito: {type: string, enum: [personal, departamento]}
        departamento:
          type: string
          description: Obligatorio si `ambito = departamento`; debe ser un grupo del usuario.
        filtro: {$ref: '#/components/schemas/FiltroLicitaciones'}
        eventos:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [licitacion.nueva, licitacion.modificada, licitacion.adjudicada, licitacion.formalizada, licitacion.anulada]}
        competidores:
          type: array
          maxItems: 50
          description: Alerta de competencia (§5.6) — avisar cuando estos proveedores ganan algo que encaja con el filtro.
          items: {$ref: '#/components/schemas/OrganizacionId'}
        canal: {type: string, enum: [panel, correo, resumen_diario]}
        activa: {type: boolean, default: true}

    AlertaCambio:
      type: object
      additionalProperties: false
      properties:
        nombre: {type: string, minLength: 1, maxLength: 120}
        filtro: {$ref: '#/components/schemas/FiltroLicitaciones'}
        eventos:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [licitacion.nueva, licitacion.modificada, licitacion.adjudicada, licitacion.formalizada, licitacion.anulada]}
        competidores: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/OrganizacionId'}}
        canal: {type: string, enum: [panel, correo, resumen_diario]}
        activa: {type: boolean}

    Alerta:
      allOf:
        - $ref: '#/components/schemas/AlertaEntrada'
        - type: object
          required: [id, propietario, creada_en, etag]
          properties:
            id: {type: string, format: uuid}
            propietario: {type: string}
            creada_en: {type: string, format: date-time}
            cambiada_en: {type: string, format: date-time}
            ultima_entrega: {type: [string, 'null'], format: date-time}
            etag: {type: string}

    Rango:
      type: object
      required: [min, probable, max]
      properties:
        min: {type: number}
        probable: {type: number}
        max: {type: number}

    SimulacionEntrada:
      type: object
      required: [licitacion_id, lote, reglas, puntuacion_tecnica_propia, coste, precios]
      additionalProperties: false
      properties:
        licitacion_id: {type: string, format: uuid}
        lote: {type: string}
        reglas:
          type: object
          description: Reglas del pliego extraídas con cita por el Analista de Pliegos y **validadas por una persona**.
          required: [formula_economica, peso_precio, peso_calidad, baja_anormal, validadas_por, validadas_en, cita]
          additionalProperties: false
          properties:
            formula_economica:
              type: string
              description: Id del módulo de fórmula implementado en `internal/simulation` (lista cerrada; una fórmula nueva = módulo nuevo).
              examples: [proporcional_inversa, lineal_baja_maxima]
            parametros_formula:
              type: object
              additionalProperties: {type: number}
            peso_precio: {type: number, minimum: 0, maximum: 100}
            peso_calidad: {type: number, minimum: 0, maximum: 100}
            puntuacion_maxima: {type: number, default: 100}
            baja_anormal:
              type: object
              required: [origen]
              properties:
                origen: {type: string, enum: [pliego, reglamentario]}
                parametros:
                  type: object
                  additionalProperties: {type: number}
            validadas_por: {type: string, minLength: 1}
            validadas_en: {type: string, format: date-time}
            cita: {type: string, description: Referencia al fragmento del pliego (cuaderno de investigación).}
        puntuacion_tecnica_propia: {$ref: '#/components/schemas/Rango'}
        coste:
          $ref: '#/components/schemas/Importe'
          description: Coste real (agente Costes). Dato sensible; solo lo ve el departamento que simula.
        precios:
          type: object
          description: Precios de 101.cat a evaluar (sin IVA); como mucho 200 puntos.
          required: [desde, hasta, paso]
          properties:
            desde: {type: string, pattern: '^[0-9]{1,12}(\.[0-9]{1,2})?$'}
            hasta: {type: string, pattern: '^[0-9]{1,12}(\.[0-9]{1,2})?$'}
            paso: {type: string, pattern: '^[0-9]{1,12}(\.[0-9]{1,2})?$'}
        riesgo_baja_anormal_max:
          type: number
          minimum: 0
          maximum: 1
          description: Riesgo máximo aceptado (lo fija Dirección) para señalar el precio de mejor margen esperado.
        supuestos:
          type: object
          properties:
            incluir_competidores: {type: array, maxItems: 30, items: {$ref: '#/components/schemas/OrganizacionId'}}
            excluir_competidores: {type: array, maxItems: 30, items: {$ref: '#/components/schemas/OrganizacionId'}}
            ofertas_esperadas: {$ref: '#/components/schemas/Rango'}
        escenarios: {type: integer, minimum: 1000, maximum: 20000, default: 10000}
        semilla: {type: integer, description: 'Para reproducir el resultado; si falta, la elige el servidor y la devuelve.'}

    PuntoCurva:
      type: object
      required: [precio, prob_ganar, riesgo_baja_anormal, margen_esperado]
      properties:
        precio: {type: string}
        prob_ganar: {$ref: '#/components/schemas/Rango'}
        riesgo_baja_anormal: {type: number, minimum: 0, maximum: 1}
        margen_esperado: {$ref: '#/components/schemas/Rango'}

    Simulacion:
      type: object
      required: [id, creada_en, creada_por, entrada, resultado]
      properties:
        id: {type: string, format: uuid}
        creada_en: {type: string, format: date-time}
        creada_por: {type: string}
        departamento: {type: string}
        entrada: {$ref: '#/components/schemas/SimulacionEntrada'}
        resultado:
          type: object
          required: [curva, competidores_probables, muestra, apto_para_decidir, semilla, version_simulador]
          properties:
            curva: {type: array, items: {$ref: '#/components/schemas/PuntoCurva'}}
            precio_mejor_margen_dentro_de_riesgo:
              type: [string, 'null']
              description: Señalado, no decidido. null si ningún precio cumple el riesgo máximo.
            competidores_probables:
              type: array
              items:
                type: object
                required: [organizacion, prob_presentarse, datos]
                properties:
                  organizacion: {$ref: '#/components/schemas/OrganizacionRef'}
                  prob_presentarse: {type: number, minimum: 0, maximum: 1}
                  baja_media: {type: [number, 'null']}
                  datos: {type: integer, description: Concursos parecidos en los que se basa.}
                  origen_distribucion: {type: string, enum: [propia, mercado]}
            muestra: {$ref: '#/components/schemas/Muestra'}
            apto_para_decidir:
              type: boolean
              description: false mientras el *backtesting* no alcance la precisión acordada con Licitaciones (§6).
            precision_backtesting:
              type: [object, 'null']
              properties:
                metrica: {type: string}
                valor: {type: number}
                medida_en: {type: string, format: date}
            avisos: {type: array, items: {type: string}}
            semilla: {type: integer}
            version_simulador: {type: string}
            duracion_ms: {type: integer}

    AreaCpv:
      type: string
      description: |
        Área de negocio de 101.cat; agrupa los 20 CPV decididos (§12.1 del proyecto). La pertenencia se calcula **en la
        proyección** (campo `areas` de `tenders` y `awards`) con la tabla de `config/areas_cpv.yaml` del motor, un único
        sitio para la regla de jerarquía de CPV (§12.1, propuesta por validar). Un lote puede estar en varias áreas.
        - `ti`: 72000000-5, 72200000-7, 72230000-6, 72262000-9, 72267000-4
        - `videovigilancia`: 32323500-8, 32235000-9, 32234000-2, 35125300-2, 35120000-1, 32441100-7 (vigilancia
          telemétrica: asignación POR VALIDAR con Licitaciones)
        - `trafico`: 34970000-7, 34923000-3, 34971000-4, 34972000-1, 63712710-3, 45316210-0
        - `control_accesos`: 42961000-0, 42961100-1
        - `redes`: 32420000-3
      enum: [ti, videovigilancia, trafico, control_accesos, redes]

    Periodo:
      type: string
      description: |
        Periodo del dashboard. `hoy` = desde las 00:00 de hoy (Europe/Madrid); `7d`/`30d`/`90d` = hoy y los 6/29/89 días
        anteriores, desde las 00:00. Los límites caen en medianoche para que la caché sea estable.
      enum: [hoy, 7d, 30d, 90d]

    Ventana:
      type: object
      required: [desde, hasta, zona_horaria]
      properties:
        periodo: {$ref: '#/components/schemas/Periodo'}
        desde: {type: string, format: date-time}
        hasta: {type: string, format: date-time, description: Instante del cálculo (o fin del día de ayer en ventanas cerradas).}
        zona_horaria: {type: string, const: Europe/Madrid}

    EnlaceListado:
      type: object
      description: |
        Listado que origina una cifra: endpoint del motor y sus parámetros **exactos** (los mismos nombres y formatos que
        en ese endpoint, valores en texto; un array = parámetro repetido). El panel lo traduce a su ruta
        (`/tenders` → `/licitaciones/buscar`, ver ADR 0007 §4) sin reinterpretar filtros.
      required: [ruta, parametros, cuenta_igual_a_total]
      properties:
        ruta:
          type: string
          enum: [/tenders, /awards, /expiring-contracts, /competitors]
        parametros:
          type: object
          additionalProperties:
            oneOf:
              - {type: string}
              - {type: array, items: {type: string}}
          examples:
            - {area: [ti, videovigilancia, trafico, control_accesos, redes], nuts: [ES], publicada_desde: '2026-10-20T00:00:00+02:00', encaje_min: '70', orden: encaje}
        cuenta_igual_a_total:
          type: boolean
          description: true si la cifra es igual al `total.valor` del listado (con la misma generación del índice).

    Cifra:
      type: object
      required: [valor, enlace]
      properties:
        valor: {type: integer, minimum: 0}
        enlace:
          oneOf:
            - $ref: '#/components/schemas/EnlaceListado'
            - type: 'null'

    ImporteAgregado:
      type: object
      description: Suma de un único significado e impuesto (nunca mezclados). Los lotes sin ese dato se cuentan aparte.
      required: [importe, lotes_con_importe, lotes_sin_importe]
      properties:
        importe: {$ref: '#/components/schemas/Importe'}
        lotes_con_importe: {type: integer, minimum: 0}
        lotes_sin_importe: {type: integer, minimum: 0}

    EstadoGlobal:
      type: string
      enum: [ok, degradado, caido]

    Frescura:
      type: object
      description: De cuándo son las cifras de un bloque. El panel pinta el bloque en rojo si `estado_motor` no es `ok`.
      required: [calculado_en, generacion_indice, estado_motor]
      properties:
        calculado_en: {type: string, format: date-time}
        generacion_indice: {type: integer, description: '`lic:gen:tenders` o `lic:gen:awards` (ADR 0005).'}
        datos_hasta:
          type: [string, 'null']
          format: date-time
          description: Última ingesta correcta más antigua entre las fuentes principales (ver `/ops/status`).
        estado_motor: {$ref: '#/components/schemas/EstadoGlobal'}
        desde_cache: {type: boolean}

    DashboardOportunidades:
      type: object
      required: [ventana, umbral_encaje_alto, nuevas, nuevas_encaje_alto, importe_total, cierran_7_dias, por_area, por_provincia, mejores, frescura]
      properties:
        ventana: {$ref: '#/components/schemas/Ventana'}
        umbral_encaje_alto: {type: number, minimum: 0, maximum: 100}
        nuevas: {$ref: '#/components/schemas/Cifra'}
        nuevas_encaje_alto: {$ref: '#/components/schemas/Cifra'}
        importe_total:
          type: object
          description: Presupuesto base de licitación sin IVA, en EUR.
          required: [nuevas, encaje_alto]
          properties:
            nuevas: {$ref: '#/components/schemas/ImporteAgregado'}
            encaje_alto: {$ref: '#/components/schemas/ImporteAgregado'}
        cierran_7_dias:
          type: object
          required: [todas, encaje_alto]
          properties:
            todas: {$ref: '#/components/schemas/Cifra'}
            encaje_alto: {$ref: '#/components/schemas/Cifra'}
        por_area:
          type: array
          maxItems: 5
          items:
            type: object
            required: [area, etiqueta, nuevas, encaje_alto, importe]
            properties:
              area: {$ref: '#/components/schemas/AreaCpv'}
              etiqueta: {type: string, examples: [Videovigilancia]}
              nuevas: {$ref: '#/components/schemas/Cifra'}
              encaje_alto: {$ref: '#/components/schemas/Cifra'}
              importe: {$ref: '#/components/schemas/ImporteAgregado'}
        por_provincia:
          type: array
          maxItems: 60
          description: De más a menos lotes; incluye el cubo `nuts = null` (sin provincia) si tiene lotes.
          items:
            type: object
            required: [nuts, etiqueta, nuevas, encaje_alto]
            properties:
              nuts: {type: [string, 'null'], pattern: '^ES[0-9A-Z]{3}$', examples: [ES512]}
              etiqueta: {type: string, examples: [Girona, Sin provincia]}
              nuevas: {$ref: '#/components/schemas/Cifra'}
              encaje_alto: {$ref: '#/components/schemas/Cifra'}
        mejores:
          type: object
          description: Las 10 nuevas con más encaje (el `enlace` lleva al listado completo con `orden=encaje`).
          required: [items, enlace]
          properties:
            items:
              type: array
              maxItems: 10
              items: {$ref: '#/components/schemas/LicitacionResumen'}
            enlace: {$ref: '#/components/schemas/EnlaceListado'}
        frescura: {$ref: '#/components/schemas/Frescura'}

    BajaPorArea:
      type: object
      required: [area, etiqueta, baja_media, baja_p50, muestra, excluidas, enlace]
      properties:
        area: {$ref: '#/components/schemas/AreaCpv'}
        etiqueta: {type: string}
        baja_media: {type: [number, 'null'], description: 'Media de `Adjudicacion.baja` (0,15 = 15 %). null si la muestra es menor que `minimo_muestra`.'}
        baja_p50: {type: [number, 'null']}
        muestra: {$ref: '#/components/schemas/Muestra'}
        excluidas: {type: integer, minimum: 0, description: Bajas fuera del rango admitido (probable error de dato).}
        enlace: {$ref: '#/components/schemas/EnlaceListado'}

    DashboardMercado:
      type: object
      required: [ventana, ventana_mercado, alcance, minimo_muestra, adjudicaciones, top_competidores, mercado_total, bajas_por_area, contratos_que_vencen, frescura]
      properties:
        ventana: {$ref: '#/components/schemas/Ventana'}
        ventana_mercado: {$ref: '#/components/schemas/Ventana'}
        alcance: {type: string, enum: [completo, sin_competidores]}
        minimo_muestra: {type: integer, minimum: 1, default: 10}
        adjudicaciones:
          type: object
          required: [adjudicadas, desiertas, importe_adjudicado, por_area, ultimas]
          properties:
            adjudicadas: {$ref: '#/components/schemas/Cifra'}
            desiertas: {$ref: '#/components/schemas/Cifra'}
            importe_adjudicado:
              $ref: '#/components/schemas/ImporteAgregado'
              description: Importe adjudicado sin IVA, en EUR (`significado = adjudicado`).
            por_area:
              type: array
              maxItems: 5
              items:
                type: object
                required: [area, etiqueta, adjudicadas, importe_adjudicado]
                properties:
                  area: {$ref: '#/components/schemas/AreaCpv'}
                  etiqueta: {type: string}
                  adjudicadas: {$ref: '#/components/schemas/Cifra'}
                  importe_adjudicado: {$ref: '#/components/schemas/ImporteAgregado'}
            ultimas:
              type: array
              maxItems: 5
              description: Las 5 adjudicaciones más recientes (mismas reglas de datos personales que `/awards`).
              items: {$ref: '#/components/schemas/Adjudicacion'}
        top_competidores:
          type: [object, 'null']
          description: null si `alcance = sin_competidores`.
          required: [items, enlace]
          properties:
            items:
              type: array
              maxItems: 10
              items:
                type: object
                required: [competidor, enlace]
                properties:
                  competidor: {$ref: '#/components/schemas/Competidor'}
                  enlace:
                    $ref: '#/components/schemas/EnlaceListado'
                    description: '`/awards` de ese adjudicatario en la ventana de mercado (`contratos_ganados` = total).'
            enlace:
              $ref: '#/components/schemas/EnlaceListado'
              description: '`/competitors` con los mismos filtros y `orden=cuota`.'
        mercado_total:
          $ref: '#/components/schemas/ImporteAgregado'
          description: Denominador de las cuotas (adjudicado sin IVA en la ventana de mercado).
        bajas_por_area:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/BajaPorArea'}
        contratos_que_vencen:
          type: object
          required: [vence_desde, vence_hasta, total, importe_adjudicado, por_area]
          properties:
            vence_desde: {type: string, format: date}
            vence_hasta: {type: string, format: date}
            total: {$ref: '#/components/schemas/Cifra'}
            importe_adjudicado: {$ref: '#/components/schemas/ImporteAgregado'}
            por_area:
              type: array
              maxItems: 5
              items:
                type: object
                required: [area, etiqueta, total]
                properties:
                  area: {$ref: '#/components/schemas/AreaCpv'}
                  etiqueta: {type: string}
                  total: {$ref: '#/components/schemas/Cifra'}
        frescura: {$ref: '#/components/schemas/Frescura'}

    Motivo:
      type: object
      required: [componente, codigo, severidad, mensaje]
      properties:
        componente: {type: string, examples: [placsp, opensearch, proy-busqueda, api]}
        codigo:
          type: string
          enum: [fuente_sin_ingesta, frescura_fuera_de_objetivo, errores_parser, componente_no_responde, cluster_amarillo,
                 cluster_rojo, retraso_consumidor, mensajes_en_dlq, instantanea_antigua]
        severidad: {type: string, enum: [degradado, caido]}
        mensaje: {type: string, description: 'Apto para mostrar; sin hosts, IP ni errores crudos.'}
        desde: {type: [string, 'null'], format: date-time}

    EstadoFuente:
      type: object
      required: [fuente, estado, ultima_ingesta_correcta, antiguedad_s, objetivo_frescura_s]
      properties:
        fuente: {$ref: '#/components/schemas/Fuente'}
        estado: {$ref: '#/components/schemas/EstadoGlobal'}
        ultima_ingesta_correcta: {type: [string, 'null'], format: date-time}
        antiguedad_s: {type: [integer, 'null'], description: Segundos desde la última ingesta correcta.}
        ultima_ingesta:
          type: [object, 'null']
          properties:
            inicio: {type: string, format: date-time}
            fin: {type: [string, 'null'], format: date-time}
            resultado: {type: string, enum: [en_curso, correcta, con_errores, fallida]}
        retraso_publicacion_p95_s:
          type: [integer, 'null']
          description: p95 en 24 h de publicación oficial → ingesta (indicador de frescura del §11).
        objetivo_frescura_s: {type: integer, default: 7200}
        documentos_24h: {type: integer, minimum: 0}
        errores_parser_24h: {type: integer, minimum: 0}
        campos_desconocidos_24h: {type: integer, minimum: 0, description: Avisos de campos no reconocidos (cambio de formato).}

    EstadoComponente:
      type: object
      required: [nombre, estado, comprobado_en]
      properties:
        nombre: {type: string, enum: [opensearch, grafo, minio, redis, nats, postgres]}
        estado: {$ref: '#/components/schemas/EstadoGlobal'}
        comprobado_en: {type: string, format: date-time}
        latencia_ms: {type: [integer, 'null'], description: Solo en `detalle`.}
        indicadores:
          type: object
          description: |
            Solo en `detalle`. Números o textos cortos y fijos por componente (p. ej. `cluster: amarillo`,
            `disco_usado_pct`, `memoria_usada_pct`, `evicted_keys_1h`). Nunca hosts, IP ni credenciales.
          additionalProperties:
            oneOf: [{type: number}, {type: string, maxLength: 40}]

    EstadoConsumidor:
      type: object
      required: [nombre, stream, estado, pendientes, en_vuelo]
      properties:
        nombre: {type: string, examples: [proy-busqueda, proy-grafo, alertas, cerebro-embudo, ops]}
        stream: {type: string, examples: [LICITACIONES]}
        estado: {$ref: '#/components/schemas/EstadoGlobal'}
        pendientes: {type: integer, minimum: 0, description: '`num_pending`'}
        en_vuelo: {type: integer, minimum: 0, description: '`num_ack_pending`'}
        reentregados: {type: integer, minimum: 0, description: '`num_redelivered`'}
        edad_mas_antiguo_s: {type: [integer, 'null'], description: Edad del mensaje más antiguo sin confirmar.}

    EstadoMotor:
      type: object
      required: [estado, calculado_en, alcance, motivos, fuentes, componentes, umbrales]
      properties:
        estado: {$ref: '#/components/schemas/EstadoGlobal'}
        calculado_en: {type: string, format: date-time, description: Momento de la instantánea.}
        alcance: {type: string, enum: [resumen, detalle]}
        motivos:
          type: array
          description: Vacío si `estado = ok`; ordenados de más a menos grave.
          items: {$ref: '#/components/schemas/Motivo'}
        fuentes:
          type: array
          items: {$ref: '#/components/schemas/EstadoFuente'}
        componentes:
          type: array
          items: {$ref: '#/components/schemas/EstadoComponente'}
        consumidores:
          type: [array, 'null']
          description: Solo en `detalle` (consumidores de ADR 0002).
          items: {$ref: '#/components/schemas/EstadoConsumidor'}
        dlq:
          type: [object, 'null']
          description: Solo en `detalle`.
          properties:
            mensajes_1h: {type: integer, minimum: 0}
            mensajes_total: {type: integer, minimum: 0}
        proyecciones:
          type: [object, 'null']
          description: Solo en `detalle`. Generación y documentos de cada índice (ADR 0003 y 0005).
          additionalProperties:
            type: object
            properties:
              generacion: {type: integer}
              documentos: {type: integer}
        umbrales:
          type: object
          description: Umbrales con los que se ha calculado el estado (configurables).
          properties:
            frescura_objetivo_s: {type: integer, default: 7200}
            fuente_caida_s: {type: integer, default: 21600}
            errores_parser_tasa: {type: number, default: 0.01}
            retraso_consumidor_s: {type: integer, default: 900}
            retraso_consumidor_mensajes: {type: integer, default: 5000}
            instantanea_max_s: {type: integer, default: 60}
